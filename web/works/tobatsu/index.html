        display: grid;
        place-items: center;
        width: 170px;
        height: 200px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        touch-action: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      .bj-zoom > .bj-card {
        width: 104px;
        height: 145px;
        border-width: 3px;
        border-radius: 10px;
        box-shadow:
          4px 5px 0 var(--c-ink),
          0 0 22px 8px rgb(255 61 139 / 0.8);
        animation: none;
      }

      .bj-zoom > .bj-card .bj-card-r {
        left: 7px;
        top: 4px;
        font-size: 30px;
      }

      .bj-zoom > .bj-card .bj-card-r2 {
        left: auto;
        top: auto;
        right: 7px;
        bottom: 4px;
      }

      .bj-zoom > .bj-card .bj-card-s {
        font-size: 30px;
      }

      .bj-zoom-ring {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 186px;
        height: 186px;
        translate: -50% -50%;
        rotate: -90deg;
        pointer-events: none;
      }

      .bj-zoom-ring circle {
        fill: none;
        stroke: rgb(11 11 18 / 0.7);
        stroke-width: 7;
      }

      .bj-zoom-ring .bj-zoom-fill {
        stroke: #ff6fae;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        stroke-linecap: round;
        transition: stroke-dashoffset 160ms ease-out;
      }

      .bj-zoom.is-holding .bj-zoom-fill {
        stroke-dashoffset: 0;
        transition: stroke-dashoffset var(--hold, 1s) linear;
      }

      .bj-zoom-word {
        --sticker-fill: #ff6fae;

        position: absolute;
        bottom: -6px;
        font-size: 20px;
        white-space: nowrap;
        pointer-events: none;
      }

      /* 「要牌」「停牌」「加倍」在你的牌上面一排（从右往左），下面一根思考时间条——只管这一手还能想几秒，不走左下的秒数 */
      .bj-acts {
        position: absolute;
        right: 96px;
        bottom: calc(100% - var(--say-top) + 104px);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        visibility: hidden;
      }

      .bj.is-acting .bj-acts {
        visibility: visible;
      }

      .bj-btns {
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        gap: 9px;
      }

      .bj-btns2 {
        display: flex;
        flex-direction: row-reverse;
        gap: 7px;
      }

      .bj-btns2 button {
        position: relative;
        padding: 3px 10px 2px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 999px;
        background: var(--c-cream);
        box-shadow: 2px 2px 0 var(--c-ink);
        color: var(--c-ink);
        font: inherit;
        font-size: 14px;
        font-weight: 900;
        pointer-events: auto;
        touch-action: manipulation;
        cursor: pointer;
        appearance: none;
      }

      .bj-btns2 button[hidden] {
        display: none;
      }

      .bj-btns2 .bj-double {
        background: #c77dff;
        color: #fff;
      }

      .bj-btns2 .bj-split {
        background: #7fd8ff;
      }

      .bj-btns2 .bj-surrender {
        background: #3a3a48;
        color: var(--c-cream);
      }

      .bj-btns2 button:active {
        translate: 1px 2px;
        box-shadow: 1px 0 0 var(--c-ink);
      }

      .bj-btns2 .bj-hint {
        transform: none;
      }

      .bj-hit,
      .bj-stand {
        padding: 6px 13px 5px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 6px;
        background: var(--c-vermilion);
        box-shadow: 3px 4px 0 var(--c-ink);
        transform: skewX(var(--skew-button));
        pointer-events: auto;
        touch-action: manipulation;
        cursor: pointer;
        appearance: none;
      }

      .bj-hit .sticker,
      .bj-stand .sticker {
        --sticker-fill: var(--c-cream);

        font-size: 21px;
      }

      .bj-stand {
        background: var(--c-hud);
      }


      .bj-think {
        position: relative;
        height: 12px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 999px;
        background: rgb(11 11 18 / 0.6);
        box-shadow: 2px 2px 0 var(--c-ink);
      }

      .bj-think i {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--c-hud);
        transform-origin: left;
      }

      /* 最后 3 秒：变红、闪 */
      .bj-think[data-low='1'] i {
        background: var(--c-vermilion);
        animation: bj-think-low 0.5s steps(2) infinite;
      }

      @keyframes bj-think-low {
        50% {
          opacity: 0.45;
        }
      }

      /* 引诱爆牌（C）：这一次时间到算「要牌」——条变粉、左边挂一枚小签 */
      .bj-think[data-lure='hit'] i {
        background: #ff6fae;
      }

      .bj-think-tag {
        --sticker-fill: #ff6fae;

        position: absolute;
        left: 0;
        top: calc(100% + 3px);
        display: none;
        color: #ff6fae;
        font-size: 11px;
        font-weight: 900;
        white-space: nowrap;
        text-shadow:
          -1px -1px 0 var(--c-ink),
          1px -1px 0 var(--c-ink),
          -1px 1px 0 var(--c-ink),
          1px 1px 0 var(--c-ink);
      }

      .bj-think[data-lure='hit'] .bj-think-tag {
        display: block;
      }

      .bj-hit:active,
      .bj-stand:active {
        translate: 2px 3px;
        box-shadow: 1px 1px 0 var(--c-ink);
      }

      /* 牌局每一步的提示（发牌 / 你的回合 / 停牌 / 爆牌 / 翻牌 / 比大小 / 输赢 / 罚时 / 下一手）：横贯画面的一条墨色斜带 + 贴纸大字 + 一行小字 */
      .bj-call {
        position: absolute;
        left: 0;
        right: 0;
        top: 33%;
        z-index: 16;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 10px 16px 12px;
        pointer-events: none;
      }

      .bj-call-band {
        position: absolute;
        inset: 0 -12px;
        border-block: 3px solid var(--c-cream);
        background: rgb(11 11 18 / 0.86);
        transform: skewY(-3deg);
      }

      .bj-call--win .bj-call-band {
        border-color: var(--c-hud);
      }

      .bj-call--lose .bj-call-band {
        border-color: #ff6fae;
      }

      .bj-call--amulet .bj-call-band {
        border-color: #b067ff;
      }

      .bj-call-word {
        --sticker-fill: var(--c-cream);

        position: relative;
        font-size: 34px;
        line-height: 1.1;
        white-space: nowrap;
      }

      .bj-call--big .bj-call-word {
        font-size: 50px;
      }

      .bj-call--win .bj-call-word {
        --sticker-fill: var(--c-hud);
      }

      .bj-call--lose .bj-call-word {
        --sticker-fill: #ff6fae;
      }

      .bj-call--amulet .bj-call-word {
        --sticker-fill: #e6ccff;
      }

      .bj-call-sub {
        position: relative;
        color: var(--c-cream);
        font-size: 14px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      /* 罚的秒数从点数飞到左下的秒数上 */
      .bj-fly {
        --sticker-fill: #ff6fae;

        position: absolute;
        z-index: 17;
        font-size: 30px;
        pointer-events: none;
      }

      /* 发牌、想牌、翻牌的时候：秒数暗下去——这会儿不罚时（节奏照跑，慢速） */
      .app[data-bj-rest] .clock {
        opacity: 0.4;
        transition: opacity 0.2s;
      }

      .bj-pop {
        --sticker-fill: #ff6fae;

        position: absolute;
        z-index: 18;
        font-size: 20px;
        white-space: nowrap;
        pointer-events: none;
      }

      .bj-pop--win {
        --sticker-fill: var(--c-hud);
      }

      /* Aschan 的护符（原来叫破法护符）：左上一枚，戴着的时候慢慢发紫光；挡住魔法时亮一圈；交出去变灰；被她「诅咒」时发黑、抖 */
      .bj-amulet {
        position: absolute;
        left: 10px;
        top: calc(var(--hud-h) + 10px);
        z-index: 7;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        pointer-events: none;
      }

      .bj-amulet.is-shown {
        display: flex;
      }

      .bj-amulet-gem {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        filter: drop-shadow(2px 3px 0 var(--c-ink));
      }

      .bj-amulet-gem svg {
        width: 100%;
        height: 100%;
      }

      .bj-amulet.is-on .bj-amulet-gem {
        animation: bj-amulet 1.6s ease-in-out infinite alternate;
      }

      @keyframes bj-amulet {
        100% {
          filter: drop-shadow(2px 3px 0 var(--c-ink)) drop-shadow(0 0 8px rgb(176 103 255 / 0.9));
        }
      }

      .bj-amulet.is-block .bj-amulet-gem {
        animation: bj-block 0.7s ease-out;
      }

      @keyframes bj-block {
        0% {
          scale: 1;
          filter: drop-shadow(2px 3px 0 var(--c-ink)) drop-shadow(0 0 0 rgb(255 255 255 / 0));
        }
        30% {
          scale: 1.35;
          filter: drop-shadow(2px 3px 0 var(--c-ink)) drop-shadow(0 0 22px rgb(220 180 255 / 1));
        }
        100% {
          scale: 1;
        }
      }

      .bj-amulet.is-hexed .bj-amulet-gem {
        animation: bj-hex 0.24s ease-in-out infinite alternate;
      }

      @keyframes bj-hex {
        0% {
          translate: -1px 0;
          filter: brightness(0.35) saturate(0.4) drop-shadow(0 0 6px rgb(28 11 30 / 1));
        }
        100% {
          translate: 1px 0;
          filter: brightness(0.5) hue-rotate(-40deg) drop-shadow(0 0 10px rgb(255 61 139 / 0.8));
        }
      }

      .bj-amulet-name {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--c-ink);
        color: #e6ccff;
        font-size: 10px;
        white-space: nowrap;
      }

      /* 无尽模式 / 无敌模式的牌在左上角：护符挪到牌子下面（站主 2026-10-26：原来压住了「无尽模式」） */
      .app:is([data-endless], [data-invincible]) .bj-amulet {
        top: calc(var(--hud-h) + 86px);
      }

      /* 第 4 组开头她跳那段舞（整屏视频）：台词条压在视频上面，照常说话 */
      .app[data-bj-dance] .say {
        z-index: 15;
      }

      /* 魔力碎片：护符下面一排小菱形，用掉的变暗；能用的时候护符发亮、名牌变紫「点我 +1」 */
      .bj-amulet-shards {
        display: flex;
        gap: 4px;
        margin: -1px 0 1px;
      }

      .bj-amulet-shards[hidden],
      .bj-amulet[data-state='given'] .bj-amulet-shards {
        display: none;
      }

      .bj-amulet-shards i {
        width: 8px;
        height: 8px;
        border: 1.5px solid var(--c-ink);
        background: #c48bff;
        box-shadow: 0 0 5px rgb(176 103 255 / 0.95);
        transform: rotate(45deg);
      }

      .bj-amulet-shards i.is-spent {
        background: #3a2a44;
        box-shadow: none;
        opacity: 0.55;
      }

      .bj-amulet.is-usable {
        cursor: pointer;
        pointer-events: auto;
      }

      .bj-amulet.is-usable .bj-amulet-gem {
        animation: bj-usable 0.8s ease-in-out infinite alternate;
      }

      @keyframes bj-usable {
        100% {
          scale: 1.1;
          filter: drop-shadow(2px 3px 0 var(--c-ink)) drop-shadow(0 0 14px rgb(205 160 255 / 1));
        }
      }

      .bj-amulet.is-usable .bj-amulet-name {
        background: #8a3dff;
        color: #fff;
        font-weight: 900;
      }

      /* 碎片飞到手牌里、化成的那张「+1」 */
      .bj-shard-fly {
        position: absolute;
        z-index: 8;
        width: 12px;
        height: 12px;
        border: 2px solid var(--c-ink);
        background: #c48bff;
        box-shadow: 0 0 10px rgb(176 103 255 / 1);
        rotate: 45deg;
        pointer-events: none;
      }

      .bj-card[data-shard='1'] {
        width: 36px;
        background: linear-gradient(160deg, #f6e8ff, #c48bff);
        box-shadow:
          2px 3px 0 var(--c-ink),
          0 0 10px rgb(176 103 255 / 0.9);
        color: #2a0f46;
      }

      .bj-card[data-shard='1'] .bj-card-r2 {
        display: none;
      }

      .bj-card[data-shard='1'] .bj-card-s {
        color: #8a3dff;
      }

      .bj-hint--amulet {
        top: calc(100% + 8px);
        right: auto;
        bottom: auto;
        left: 0;
        transform: none;
      }

      .bj-amulet[data-state='given'] .bj-amulet-gem {
        opacity: 0.35;
        filter: grayscale(1) drop-shadow(2px 3px 0 var(--c-ink));
      }

      .bj-amulet[data-state='given'] .bj-amulet-name {
        text-decoration: line-through;
        opacity: 0.7;
      }

      .bj-amulet-fly {
        position: absolute;
        z-index: 16;
        width: 54px;
        height: 54px;
        pointer-events: none;
      }

      .bj-amulet-fly svg {
        width: 100%;
        height: 100%;
      }

      /* 交易单（她要护符 / 骗护符）/ 保险 */
      .bj-offer {
        position: absolute;
        left: 50%;
        top: calc(var(--hud-h) + 100px);
        z-index: 16;
        width: min(80%, 300px);
        padding: 18px 16px 18px;
        border: var(--stroke) solid var(--c-ink);
        border-radius: var(--radius-panel);
        background: var(--c-cream);
        box-shadow: 4px 5px 0 var(--c-ink);
        color: var(--c-ink);
        text-align: center;
        translate: -50% 0;
        rotate: -2deg;
        pointer-events: auto;
        transition: opacity 220ms;
      }

      .bj-offer.is-off {
        opacity: 0;
        pointer-events: none;
      }

      .bj-offer .stamp-tag {
        left: 12px;
        top: -12px;
        font-size: 12px;
      }

      .bj-offer-text {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.5;
      }

      .bj-offer-acts {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .bj-offer-acts button {
        padding: 8px 16px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 6px;
        background: var(--c-cream);
        box-shadow: 3px 3px 0 var(--c-ink);
        color: var(--c-ink);
        font: inherit;
        font-size: 15px;
        transform: skewX(var(--skew-button));
        cursor: pointer;
        appearance: none;
      }

      .bj-offer-acts .bj-offer-yes {
        background: #c77dff;
      }

      .bj-offer-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: var(--c-vermilion);
        transform-origin: left;
      }

      @media (prefers-reduced-motion: reduce) {
        .bj-card.is-spark,
        .bj-card.is-slip,
        .bj-card.is-cursed,
        .bj-card.is-purged,
        .bj-card.is-rewritten,
        .bj-cover,
        .bj-amulet.is-on .bj-amulet-gem,
        .bj-amulet.is-block .bj-amulet-gem,
        .bj-amulet.is-hexed .bj-amulet-gem,
        .bj-amulet.is-call .bj-amulet-gem,
        .bj-amulet.is-usable .bj-amulet-gem,
        .bj-sigil svg {
          animation: none;
        }
      }

      /* 暂停画面：左上是「第 n 组 通过」的卡，进度条挪到它右边（压在剧情那一层上面） */
      .app[data-screen='pause'] .hy-bar {
        left: 212px;
        right: 12px;
        top: calc(74px + var(--safe-top));
        z-index: 11;
      }

      .hy-bar-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 0;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }

      .hy-bar-pct {
        color: #fff;
        font-family: var(--font-num);
        font-size: 24px;
        font-weight: 400;
        line-height: 1;
        text-shadow: 0 0 10px var(--hy1);
      }

      .hy-bar-track {
        height: 9px;
        margin-top: 4px;
        overflow: hidden;
        border: 1px solid var(--hy1);
        background: rgb(11 11 18 / 0.6);
      }

      .hy-bar-track i {
        display: block;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(-45deg, var(--hy1) 0 5px, var(--hy-hot) 5px 10px);
        box-shadow: 0 0 8px var(--hy1);
        transform: scaleX(0);
        transform-origin: 0 50%;
      }

      .hy-bar.is-done .hy-bar-head {
        color: #fff;
        animation: hy-blink 0.5s steps(1) infinite;
      }

      /* 满了：一枚主色的章歪着盖在条上 */
      .hy-bar-stamp {
        position: absolute;
        right: 8px;
        top: 60%;
        padding: 1px 10px 2px;
        border: 2px solid var(--hy2);
        background: var(--hy1);
        box-shadow: 0 0 16px var(--hy-glow);
        color: var(--hy2);
        font-size: 22px;
        letter-spacing: 0.08em;
        white-space: nowrap;
        rotate: -8deg;
        scale: 0;
      }

      .hy-bar.is-done .hy-bar-stamp {
        animation: hy-stamp 420ms cubic-bezier(0.3, 0.7, 0.3, 1) both;
      }

      @keyframes hy-stamp {
        from {
          scale: 2.6;
          opacity: 0;
        }

        60% {
          scale: 0.92;
          opacity: 1;
        }

        to {
          scale: 1;
          opacity: 1;
        }
      }

      @keyframes hy-blink {
        50% {
          opacity: 0.35;
        }
      }

      /* 开关面板：从左边滑出来，拨一行，再收回去 */
      .hy-sw {
        position: absolute;
        left: 10px;
        top: calc(var(--hud-h) + 74px);
        z-index: 7;
        min-width: 150px;
        padding: 6px 9px 8px;
        border: 1px solid var(--hy1);
        background: var(--hy-pane);
        box-shadow:
          0 0 12px var(--hy-glow),
          inset 0 0 9px rgb(255 95 168 / 0.22);
        color: var(--hy-hot);
        font-size: 13px;
        line-height: 1.5;
        opacity: 0;
        translate: -120% 0;
        transition:
          translate 300ms cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 200ms;
      }

      .hy-sw.is-on {
        opacity: 1;
        translate: 0 0;
      }

      .hy-sw p {
        margin: 0;
      }

      .hy-sw-head {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid rgb(255 95 168 / 0.55);
        color: #fff;
        font-size: 0.86em;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .hy-sw-head i {
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        background: var(--hy1);
        box-shadow: 0 0 0.6em var(--hy1);
        animation: hy-blink 1s steps(1) infinite;
      }

      .hy-sw-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 0.4em;
        padding: 0 0.3em;
        white-space: nowrap;
      }

      .hy-sw-row.is-hot {
        background: rgb(255 95 168 / 0.45);
        color: #fff;
      }

      .hy-chip {
        min-width: 2.7em;
        padding: 0 0.4em;
        font-family: var(--font-num);
        font-weight: 400;
        letter-spacing: 0.06em;
        text-align: center;
      }

      .hy-chip--on {
        background: var(--hy1);
        box-shadow: 0 0 0.8em var(--hy-glow);
        color: var(--hy2);
      }

      .hy-chip--off {
        outline: 1px solid rgb(255 95 168 / 0.55);
        outline-offset: -1px;
        opacity: 0.6;
      }

      .hy-sw-row[data-state='on'] .hy-chip--off,
      .hy-sw-row[data-state='off'] .hy-chip--on {
        display: none;
      }

      .hy-sw-read {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 0.6em;
        padding-top: 0.4em;
        border-top: 1px dashed rgb(255 95 168 / 0.55);
        white-space: nowrap;
      }

      .hy-sw-read b {
        color: #fff;
        font-family: var(--font-num);
        font-weight: 400;
        text-shadow: 0 0 0.6em var(--hy1);
      }

      /* 叠在战斗图前面的怀表（fx.js pendulumFrame：位置、大小、摆角每帧写）：在立绘画布上面、切图的那一下闪光下面 */
      .hy-pend {
        position: absolute;
        max-width: none;
        pointer-events: none;
        will-change: transform;
        transition: opacity 160ms;
      }

      /* 环字：两圈字绕着螺旋中心反着转（fx.js 每帧把它挪到螺旋中心） */
      .hy-ring {
        position: absolute;
        width: 560px;
        height: 560px;
        opacity: 0;
        translate: -50% -50%;
        transition: opacity 500ms;
      }

      .hy-ring.is-on {
        opacity: 0.4;
      }

      /* 有题在场、字墙在场的时候退下去（同一时刻只有一个主角） */
      .hy-ring.is-on.is-dim {
        opacity: 0.14;
      }

      .hy-ring svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .hy-ring text {
        fill: #fff;
        stroke: var(--hy2);
        stroke-width: 0.5;
        paint-order: stroke;
        letter-spacing: 0.6px;
        filter: drop-shadow(0 0 5px var(--hy1));
      }

      .hy-ring-ta {
        font-size: 11px;
      }

      .hy-ring-tb {
        fill: var(--hy-hot);
        font-size: 7.5px;
      }

      .hy-ring-ga {
        animation: hy-spin 26s linear infinite;
      }

      .hy-ring-gb {
        animation: hy-spin 34s linear infinite reverse;
      }

      @keyframes hy-spin {
        to {
          rotate: 360deg;
        }
      }

      /* 字墙：同一个词铺满整屏，五行各往各的方向跑（滤色叠在画面上） */
      .hy-wall {
        position: absolute;
        inset: -30%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        opacity: 0;
        mix-blend-mode: screen;
        rotate: -9deg;
        transition: opacity 320ms;
      }

      .hy-wall.is-on {
        opacity: 0.36;
      }

      .hy-wall.is-on.is-dim {
        opacity: 0.12;
      }

      .hy-wall-row {
        display: flex;
        width: max-content;
        margin: 0;
        color: var(--hy1);
        font-size: 84px;
        line-height: 1.08;
        letter-spacing: 0.04em;
        white-space: nowrap;
        animation: hy-wall var(--dur, 8s) linear infinite;
      }

      .hy-wall-row:nth-child(even) {
        color: transparent;
        -webkit-text-stroke: 2px var(--hy-hot);
        animation-direction: reverse;
      }

      @keyframes hy-wall {
        to {
          translate: -50% 0;
        }
      }

      /* 空白（记忆断片）：一下黑掉，慢慢亮回来 */
      .fx-blank {
        position: absolute;
        inset: 0;
        z-index: 18;
        display: grid;
        place-items: center;
        background: #05030a;
        opacity: 0;
        pointer-events: none;
        transition: opacity 650ms ease-out;
      }

      .fx-blank.is-on {
        opacity: 1;
        transition-duration: 50ms;
      }

      .fx-blank-text {
        margin: 0;
        color: var(--c-cream);
        font-size: 17px;
        font-weight: 900;
        text-shadow: 0 0 14px rgb(255 111 174 / 0.55);
      }

      .fx-flash.fx-flash--white {
        background: #fff;
      }

      /* 变速（暗示被触发）：滑块泛粉光，轨道顶上一枚一闪一闪的「▲▲」 */
      .rhythm--boost .rh-knob-body {
        filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #ff5fa8);
      }

      .rhythm--boost::after {
        content: '▲▲';
        position: absolute;
        left: 50%;
        top: -22px;
        color: #ff5fa8;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: -0.1em;
        text-shadow:
          0 0 6px #ff5fa8,
          0 0 2px #0b0b12;
        translate: -50% 0;
        animation: hy-blink 0.3s steps(1) infinite;
      }

      /* 常识替换：两头的字对调之后染成螺旋的粉，一眼看得出「不对劲」 */
      .app[data-swap] .rh-cap {
        filter: drop-shadow(0 0 6px #ff5fa8);
      }

      /* 命令砸上来的那一拍：周围的画面压暗（fx.command.dim，006） */
      .fx-layer > .fx-order-dim {
        inset: 0;
        background: #05030a;
        opacity: 0;
      }

      /* 垂在镜头前面的怀表：装在一个从 HUD 下缘起的框里（链子露不到 HUD 上面），压在特写、cut-in 上面、演出层下面；
         放下来 / 收起各淡 0.3 秒。幻影（节奏加快时多出来的几只）半透明、带一点粉 */
      .hy-pend-box {
        position: absolute;
        inset: var(--hud-h) 0 0 0;
        z-index: 15;
        overflow: hidden;
        pointer-events: none;
      }

      .hy-pend-box .hy-pend {
        z-index: auto;
        transition: opacity 300ms ease-out;
      }

      .hy-pend--ghost {
        filter: saturate(0.6) brightness(1.15) drop-shadow(0 0 6px rgb(255 111 174 / 0.7));
      }

      /* 催眠状态：剧情 / 暂停 / 选项画面里她身后转着的螺旋（和战斗里同一个着色器现画，铺满整个画面） */
      .hy-adv-spiral {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* 挂在怀表上的按住：手指没跟上的时候整枚章发灰、抖 */
      .chal--drift .chal-body {
        filter: grayscale(0.8) brightness(0.8);
        animation: chal-urgent 200ms steps(1, end) infinite;
      }

      /* 混乱里背后叠的那张图（006：眼睛发光的脸） */
      .fx-confuse-back {
        position: absolute;
        left: 50%;
        top: 46%;
        height: 104%;
        width: auto;
        max-width: none;
        opacity: 0.3;
        mix-blend-mode: screen;
        transform: translate(-50%, -50%);
      }

      /* ---- 006 第三版：怀表上的题、文字顺序题、剧情里的倒数、被命令的选择、长按获胜 ---- */

      /* 套在怀表上的环（place: watch）：中间空着，看得见表盘；「点！」挪到环下面 */
      .chal--ring,
      .chal--lure {
        border-radius: 50%;
      }

      .chal--ring .chal-word {
        top: calc(50% + var(--art) * 0.45);
        font-size: max(17px, calc(var(--art) * 0.13));
      }

      .chal--ring .chal-body svg {
        filter: drop-shadow(0 0 6px rgb(200 255 46 / 0.55));
      }

      .chal--miss .chal-ring {
        stroke: var(--c-grey-locked);
      }

      /* 怀表上的诱饵：粉光比顺序题里的诱饵亮——她叫你点的就是它 */
      .chal--lure .chal-body svg {
        filter: drop-shadow(0 0 10px rgb(255 111 174 / 0.9)) drop-shadow(0 0 3px #fff);
      }

      /* 文字顺序题：章上是汉字（换回正文的粗体，比数字小一号） */
      .chal--char .chal-word--num {
        --sticker-fill: #ffd3e6;

        font-family: var(--font-sans);
        /* --fit：章上是一个词的时候（英语版一个词一枚）按字宽缩小，challenge.js fitWord 写 */
        font-size: calc(var(--art) * 0.3 * var(--fit, 1));
        font-weight: 900;
        white-space: nowrap;
      }

      /* 剧情里的倒数（开场 3、2、1、0）：数字染成粉的；0 换成白底粉光 */
      .app[data-screen='story'] .count {
        --sticker-fill: var(--fx-pink);
        --r: 5px;
        --shadow-x: 6px;
        --shadow-y: 7px;

        /* 怀表的特写框占着画面中间：数字小一号、挪到它上面，压在框的上面 */
        top: 13%;
        z-index: 16;
        font-size: 132px;
        filter: drop-shadow(0 0 18px rgb(255 111 174 / 0.85));
      }

      .app[data-screen='story'] .count.count--zero {
        --sticker-fill: #fff;

        filter: drop-shadow(0 0 26px #ff5fa8) drop-shadow(0 0 8px #fff);
      }

      /* 被命令的选择：「给出最后一击」碎掉，剩下的那个一下一下发粉光 */
      .choice--gone {
        pointer-events: none;
      }

      .choice--forced {
        background: #ff5fa8;
        animation: choice-forced 0.9s ease-in-out infinite;
      }

      @keyframes choice-forced {
        50% {
          box-shadow:
            4px 4px 0 var(--c-ink),
            0 0 22px 4px rgb(255 95 168 / 0.85);
        }
      }

      /* 长按获胜（放弃按钮被幻化）：整条染成螺旋的粉，字发光 */
      .quit[data-morph] .slab-fill {
        background: #ff5fa8;
      }

      .quit[data-morph] .quit-pill {
        background: #ff5fa8;
      }

      .quit[data-morph] .slab-body .sticker {
        filter: drop-shadow(0 0 8px #fff);
      }

      /* 进度条让位：「无尽模式」牌在左上（假装无尽的那一组）→ 挪到牌下面；全部通过的画面大标题在上面 → 挪到台词条上面 */
      .app[data-endless] .hy-bar,
      .app[data-invincible] .hy-bar {
        top: calc(var(--hud-h) + 92px);
      }

      .app[data-screen='clear'] .hy-bar {
        top: auto;
        bottom: calc(196px + var(--safe-bottom));
        right: 12px;
      }

      /* 洗脑解除（真的全部通过）：条退回 0，标签变成 HUD 绿 */
      .hy-bar.is-broken .hy-bar-head {
        color: var(--c-hud);
      }

      @media (prefers-reduced-motion: reduce) {
        .hy-bar,
        .hy-sw,
        .fx-blank {
          transition: none;
        }

        .choice--forced {
          animation: none;
        }

        .hy-bar.is-done .hy-bar-head,
        .hy-bar.is-done .hy-bar-stamp,
        .hy-sw-head i,
        .rhythm--boost::after {
          animation: none;
        }

        .hy-bar.is-done .hy-bar-stamp {
          scale: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app" data-screen="boot" data-phase="early">
      <i class="hud-shade" aria-hidden="true"></i><i class="hud-edge" aria-hidden="true"></i>
      <header class="hud">
        <span class="hud-name sticker" id="hud-name"></span>
        <!-- 画面效果（性能档）：点开选 自动 / 高 / 中 / 低，存本机 -->
        <button type="button" class="hud-perf" id="hud-perf" aria-label="画面效果" aria-expanded="false" aria-controls="perf-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <circle cx="9" cy="7" r="2.6" fill="var(--c-cream)" stroke="currentColor" stroke-width="2" />
            <circle cx="15.5" cy="12" r="2.6" fill="var(--c-cream)" stroke="currentColor" stroke-width="2" />
            <circle cx="7" cy="17" r="2.6" fill="var(--c-cream)" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
        <button type="button" class="hud-sound" id="hud-sound" aria-label="声音" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path class="off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
        <span class="hud-set num" id="hud-set"></span>
      </header>

      <!-- 无尽战斗的标题（站主 2026-09-19）：准备倒数和战斗时贴在 HUD 下面左边 -->
      <div class="mode-tag" aria-hidden="true">
        <div class="mode-tag-edge">
          <div class="mode-tag-fill">
            <i class="mode-tag-stripe"></i>
            <span class="mode-tag-text">
              <span class="mode-tag-en num">ENDLESS<b>∞</b></span>
              <span class="mode-tag-cn sticker sticker--large" data-text="无尽模式">无尽模式</span>
            </span>
          </div>
        </div>
      </div>
      <!-- 无敌模式的牌（累计失败够多之后解锁；战斗和准备倒数时贴在同一个位置） -->
      <div class="mode-tag mode-tag--inv" aria-hidden="true">
        <div class="mode-tag-edge">
          <div class="mode-tag-fill">
            <i class="mode-tag-stripe"></i>
            <span class="mode-tag-text">
              <span class="mode-tag-en num">INVINCIBLE</span>
              <span class="mode-tag-cn sticker sticker--large" data-text="无敌模式">无敌模式</span>
            </span>
          </div>
        </div>
      </div>

      <!-- 版面标尺：战斗图按它们取景（HUD 下缘、台词条上缘），不管当前画面有没有显示 HUD 和台词条 -->
      <i class="mark" id="hud-mark"></i>
      <i class="mark" id="say-mark"></i>

      <section class="stage" aria-hidden="true">
        <div class="art" id="art">
          <div class="art-img" id="art-img"></div>
          <div class="art-flash" id="art-flash"></div>
        </div>
        <div class="art-dots"></div>
        <div class="cutin" id="cutin" data-side="right">
          <div class="cutin-edge"></div>
          <div class="cutin-media" id="cutin-media"></div>
          <p class="cutin-line" id="cutin-line"><span class="sticker sticker--large"></span></p>
        </div>
      </section>

      <div class="fatigue"></div>
      <div class="fatigue-beat" id="fatigue-beat"></div>

      <!-- 节奏指示器 -->
      <div class="rhythm" id="rhythm" aria-hidden="true">
        <div class="rh-rail"></div>
        <div class="rh-range" id="rh-range"></div>
        <span class="rh-cap" id="rh-cap-top">提</span>
        <span class="rh-cap" id="rh-cap-bottom">压</span>
        <div class="rh-burst" id="rh-burst"></div>
        <div class="rh-ghost"></div>
        <div class="rh-ghost"></div>
        <div class="rh-ghost"></div>
        <div class="rh-ghost"></div>
        <div class="rh-knob" id="rh-knob" data-dir="hold">
          <span class="rh-knob-body" id="rh-knob-body"></span>
        </div>
        <div class="rh-fx" id="rh-fx"></div>
        <span class="rh-reps num sticker" id="rh-reps"></span>
      </div>

      <p class="clock num sticker sticker--large" id="clock" hidden></p>
      <p class="count num sticker sticker--large" id="count" hidden></p>
      <div class="prep-tip" id="prep-tip" hidden><p id="prep-tip-text"></p></div>

      <div class="say slab" id="say" aria-live="polite">
        <i class="slab-shadow"></i><i class="slab-edge"></i><i class="slab-fill"></i>
        <div class="slab-body"><p class="say-text" id="say-text"></p></div>
      </div>

      <!-- 委托单 -->
      <section class="brief slab" id="brief" hidden>
        <i class="slab-shadow"></i><i class="slab-edge"></i><i class="slab-fill"></i>
        <div class="slab-body">
          <span class="brief-tag">委托书</span>
          <span class="brief-draft" id="brief-draft" hidden>本机草稿</span>
          <h1 class="brief-name sticker" id="brief-name"></h1>
          <dl class="brief-rows">
            <div>
              <dt>委托人</dt>
              <dd><span id="brief-client"></span></dd>
            </div>
            <div id="brief-reward-row">
              <dt>报酬</dt>
              <dd class="brief-reward">
                <b class="num" id="brief-reward"></b><span class="brief-cleared" id="brief-cleared" hidden>已完成 · 已领取</span>
              </dd>
            </div>
            <div>
              <dt>目标</dt>
              <dd class="brief-goal">
                <b class="num" id="brief-sets"></b>组<span class="num x">×</span><b class="num" id="brief-secs"></b><span id="brief-unit">秒</span>
              </dd>
            </div>
            <div>
              <dt>记录</dt>
              <dd class="brief-record" id="brief-record"></dd>
            </div>
            <div id="brief-mode-row" hidden>
              <dt>模式</dt>
              <dd class="brief-mode">
                <button type="button" data-mode="off" aria-pressed="true">普通</button>
                <button type="button" data-mode="on" aria-pressed="false">无敌</button>
                <small>无敌：题做错不算输；通关不算完成，没有报酬和奖杯</small>
              </dd>
            </div>
          </dl>
          <p class="brief-open" id="brief-open"></p>
        </div>
      </section>

      <!-- 结算层 -->
      <div class="pass" id="pass" hidden></div>
      <div class="big-title" id="big-title" hidden></div>
      <div class="stamps" id="stamps" hidden></div>
      <div class="best" id="best" hidden></div>

      <!-- 放弃（长按） -->
      <div class="quit" id="quit" data-state="pill">
        <button type="button" class="quit-pill" id="quit-pill">
          <i class="quit-fill"></i><span>放弃</span>
        </button>
        <button type="button" class="quit-bar slab" id="quit-bar">
          <span class="quit-bar-inner" id="quit-bar-inner">
            <i class="slab-shadow"></i><i class="slab-edge"></i><i class="slab-fill"><i class="quit-fill"></i></i>
            <span class="slab-body"><span class="sticker" data-text="长按放弃">长按放弃</span></span>
          </span>
        </button>
      </div>

      <div class="actions" id="actions"></div>

      <!-- 剧情对话 / 暂停 / 最后一击 -->
      <section class="adv" id="adv" data-who="narrator">
        <div class="adv-bg" id="adv-bg"></div>
        <div class="stand" id="stand-her" data-state="off"></div>
        <div class="adv-dots"></div>

        <div class="adv-status" id="adv-status"></div>
        <div class="adv-menu" id="adv-menu"></div>

        <div class="adv-box slab" id="adv-box">
          <i class="slab-shadow"></i><i class="slab-edge"></i><i class="slab-fill"></i>
          <div class="slab-body"><p class="adv-text" id="adv-text"></p></div>
          <span class="adv-name" id="adv-name"><span class="sticker"></span></span>
          <i class="adv-next"></i>
        </div>

        <button type="button" class="adv-skip" id="adv-skip">跳过<i></i><i></i></button>
      </section>
    </div>

    <script>
      /*
       * 启动出错时把原因写在画面上，不再是一片深蓝：脚本没载到（404 / 断网），或者一开场就抛错。
       * game.9a7df4cb23.js 上线时文件名带内容哈希（pnpm run import 加的），换版本就是换文件，不会新旧混用。
       */
      (() => {
        const fail = (msg) => {
          const box = document.createElement('div');
          box.className = 'oops';
          box.innerHTML = '<p>游戏没能启动。刷新一下试试；还不行就把下面这行发给站主。</p><code></code>';
          box.querySelector('code').textContent = msg;
          (document.getElementById('app') || document.body).append(box);
        };
        const booting = () => document.getElementById('app')?.dataset.screen === 'boot';
        addEventListener(
          'error',
          (e) => {
            // 只认包自己的脚本：Cloudflare 会往 HTML 里插统计脚本（被 CSP 拦下也会触发 error），那不是游戏的事
            if (e.target instanceof HTMLScriptElement) {
              if (booting() && new URL(e.target.src, location.href).origin === location.origin) {
                fail(`脚本没载到：${e.target.getAttribute('src')}`);
              }
            }
            else if (booting() && !(e.target instanceof Element)) fail(e.message || String(e.error));
          },
          true,
        );
        addEventListener('unhandledrejection', (e) => booting() && fail(String(e.reason?.message ?? e.reason)));
      })();
    </script>
    <script src="game.9a7df4cb23.js"></script>
    <script src="fx.95ba3bedf1.js"></script>
    <script src="challenge.e79d111f0f.js"></script>
    <script src="card.eebe6941a9.js"></script>
    <script src="blackjack.d5aef301f8.js"></script>
  </body>
</html>
