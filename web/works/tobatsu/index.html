        border-radius: 999px;
        background: var(--c-ink);
        color: var(--c-cream);
        font-size: 12px;
        font-weight: 900;
        line-height: 1.4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-out;
      }

      .perf-note.is-on {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .perf-note {
          transition: none;
        }
      }

      /* 点了节奏轨的提醒（game.js rhTapHint）：轨道左边一张 cream 小卡，尖角指着轨道；『』里的词垫粉底 */
      .rh-tip {
        position: absolute;
        z-index: 29;
        box-sizing: border-box;
        width: max-content;
        max-width: min(62%, 232px);
        padding: 9px 13px 10px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 10px;
        background: var(--c-cream);
        box-shadow: 4px 5px 0 var(--c-ink);
        color: var(--c-ink);
        font-size: 14px;
        font-weight: 900;
        line-height: 1.5;
        translate: 0 -50%;
        transform-origin: 100% 50%;
        opacity: 0;
        scale: 0.85;
        pointer-events: none;
        transition:
          opacity 160ms ease-out,
          scale 220ms cubic-bezier(0.3, 1.5, 0.5, 1);
      }

      .rh-tip.is-on {
        opacity: 1;
        scale: 1;
      }

      .rh-tip::after {
        content: '';
        position: absolute;
        top: 50%;
        right: -7px;
        width: 13px;
        height: 13px;
        border-top: var(--stroke-sm) solid var(--c-ink);
        border-right: var(--stroke-sm) solid var(--c-ink);
        background: var(--c-cream);
        translate: 0 -50%;
        rotate: 45deg;
      }

      /*
       * 粉框（game.js markChips：节奏轨提醒卡、闭眼那句）：挨着的几个『』并成一个框。
       * 全角括号的字形只占字框的一边——Noto Sans SC 的『画在右边 40%、』画在左边 40%，外侧各空 0.6 个字宽——
       * 用负边距收掉外侧那一截，框才左右对称；日语整页用 M PLUS 1，括号空得少（0.45），收得也少
       */
      .chip {
        padding: 0 4px;
        border-radius: 3px;
        background: var(--fx-pink);
        color: var(--c-ink);
        font-style: normal;
        white-space: nowrap;
      }

      .chip-open {
        margin-left: -0.5em;
      }

      .chip-close {
        margin-right: -0.5em;
      }

      :root:lang(ja) .chip-open {
        margin-left: -0.34em;
      }

      :root:lang(ja) .chip-close {
        margin-right: -0.34em;
      }

      /* 遵命计数（game.js obeyRender，委托写了 reward.counter）：HUD 下面正中一枚墨色小牌，粉字「遵命」+ 米白「×n」 */
      .obey-count {
        position: absolute;
        top: calc(var(--hud-h) + 10px);
        left: 50%;
        z-index: 7;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 2px 11px 3px 10px;
        border: var(--stroke-sm) solid var(--fx-pink);
        border-radius: 999px;
        background: var(--c-ink);
        translate: -50% 0;
        pointer-events: none;
      }

      /* 全部通过的画面不挂：台词条会把次数说出来，大标题的小签也在这一块 */
      .app[data-obey]:is([data-screen='prep'], [data-screen='hold'], [data-screen='pass'], [data-screen='pause'], [data-screen='endless']) .obey-count {
        display: flex;
      }

      .obey-label {
        color: var(--fx-pink);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
      }

      .obey-num {
        --sticker-fill: var(--c-cream);
        --r: 1.5px;

        font-family: var(--font-num);
        font-size: 18px;
        line-height: 1.1;
      }

      /* 点到的地方：一个墨色圈里画 ✕ */
      .rh-nope {
        position: absolute;
        z-index: 29;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        box-sizing: border-box;
        border: 3px solid var(--c-ink);
        border-radius: 50%;
        background: rgb(255 245 225 / 0.7);
        pointer-events: none;
      }

      .rh-nope::before,
      .rh-nope::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: var(--c-ink);
        translate: -50% -50%;
        rotate: 45deg;
      }

      .rh-nope::after {
        rotate: -45deg;
      }

      @media (prefers-reduced-motion: reduce) {
        .rh-tip {
          transition: none;
        }
      }

      .perf-hud {
        position: absolute;
        top: 46px;
        left: 8px;
        z-index: 30;
        padding: 3px 7px;
        background: rgb(11 11 18 / 0.78);
        color: #c8ff2e;
        font: 700 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }

      .fl-whisper {
        line-height: 1.35;
        letter-spacing: 0.06em;
        text-align: center;
        translate: -50% -50%;
      }

      /* 耳语一行一块：fx.js 先按字数把句子分成差不多长的几行（尾巴跟着前一个字），行内不再换行 */
      .fl-line {
        white-space: nowrap;
      }

      /* 气泡：形状整张画在 SVG 里（fx.js bubbleShape），这里只管字和各层的颜色 */
      /* min-width：尾巴从本体一角往里伸到 x≈68（加描边）；字少（两个字以下）时本体比这窄，尾巴的角会从侧边露出来 */
      .fl-bubble {
        box-sizing: border-box;
        min-width: 96px;
        max-width: 13em;
        padding: 10px 16px;
        text-align: center;
        color: var(--c-ink);
        font-size: 16px;
        font-weight: 900;
        line-height: 1.4;
      }

      .fl-bubble > span {
        position: relative;
        white-space: pre-line;
      }

      .fl-bubble-shape {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .fl-bubble-shape :is(rect, polygon) {
        stroke-linejoin: round;
      }

      .fl-bubble-shape .shadow :is(rect, polygon) {
        fill: var(--c-ink);
        stroke: var(--c-ink);
        stroke-width: 11px;
      }

      .fl-bubble-shape .ring :is(rect, polygon) {
        fill: var(--fx-pink);
        stroke: var(--fx-pink);
        stroke-width: 11px;
      }

      .fl-bubble-shape .ink :is(rect, polygon) {
        fill: var(--c-ink);
        stroke: var(--c-ink);
        stroke-width: 5px;
      }

      .fl-bubble-shape .fill :is(rect, polygon) {
        fill: var(--c-cream);
      }

      .fl-shout {
        width: min(88%, 560px);
        text-align: center;
      }

      .fl-shout .sticker {
        --sticker-fill: var(--fx-pink);
        --r: 4px;
        --shadow-x: 6px;
        --shadow-y: 7px;

        font-size: clamp(38px, 12vw, 64px);
        font-weight: 900;
        line-height: 1.15;
        white-space: normal;
      }

      /* 命令（fx.js command）：集中线正中，墨底粉字的「命令」小签 + cream 大字——和集中线的粉底大字分开，一看就是叫你做的事 */
      .fl-order {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(88%, 520px);
        text-align: center;
      }

      /* 身后一条斜着横贯画面的半透明墨带：cream 字压在白衣服上也读得清 */
      .fl-order::before {
        content: '';
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        width: 160vw;
        height: calc(100% + 36px);
        border-block: var(--stroke-sm) solid rgb(255 111 174 / 0.8);
        background: rgb(11 11 18 / 0.55);
        translate: -50% -50%;
        rotate: var(--slash-angle);
      }

      .fl-order-tag {
        padding: 3px 10px 4px 14px;
        border: var(--stroke-sm) solid var(--fx-pink);
        background: var(--c-ink);
        color: var(--fx-pink);
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.3em;
        line-height: 1.3;
        rotate: -4deg;
        box-shadow: 3px 4px 0 var(--c-ink);
      }

      :root:lang(en) .fl-order-tag {
        font-family: var(--font-num);
        font-weight: 400;
        letter-spacing: 0.12em;
        padding-left: 12px;
      }

      /* 命令下面的「奖励」按钮（委托写了 reward.cutins 才有）：粉底药丸，一下一下地鼓；点了放奖励 cut-in */
      .fl-order-reward {
        margin-top: 2px;
        padding: 6px 24px 8px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 999px;
        background: var(--fx-pink);
        box-shadow: 4px 5px 0 var(--c-ink);
        font: inherit;
        font-size: 20px;
        font-weight: 900;
        line-height: 1.2;
        pointer-events: auto;
        cursor: pointer;
        animation: reward-throb 0.9s ease-in-out infinite;
        -webkit-tap-highlight-color: transparent;
      }

      .fl-order-reward .sticker {
        --sticker-fill: var(--c-cream);
        --r: 2px;

        font-size: 22px;
        letter-spacing: 0.08em;
      }

      .fl-order-reward:disabled {
        animation: none;
        opacity: 0.6;
      }

      @keyframes reward-throb {
        50% {
          scale: 1.08;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fl-order-reward {
          animation: none;
        }
      }

      /* 闭眼（fx.js blind）：整个画面压暗，只剩一句字；没开声音（peek）浅一点、节奏轨留在上面。放弃按钮一直在最上面 */
      .fx-blind {
        position: absolute;
        inset: 0;
        z-index: 18;
        display: grid;
        place-items: center;
        background: rgb(6 4 12 / 0.94);
        opacity: 0;
        pointer-events: none;
        transition: opacity 700ms ease-in-out;
      }

      .fx-blind.is-on {
        opacity: 1;
      }

      .app[data-blind='peek'] .fx-blind {
        background: rgb(6 4 12 / 0.72);
      }

      .app[data-blind='peek'] .rhythm,
      .app[data-blind] .quit {
        z-index: 19;
      }

      .fx-blind-text {
        max-width: 78%;
        margin: 0;
        color: var(--c-cream);
        font-size: 17px;
        font-weight: 900;
        line-height: 1.6;
        text-align: center;
        text-shadow: 0 0 14px rgb(255 111 174 / 0.55);
      }

      .fx-blind-text .chip {
        text-shadow: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .fx-blind {
          transition: none;
        }
      }

      /* 寸止的倒数：滑块左边砸下来的粉色大数字 */
      .fx-edge-count .sticker {
        --sticker-fill: var(--fx-pink);
        --r: 4px;
        --shadow-x: 5px;
        --shadow-y: 6px;

        font-family: var(--font-num);
        font-size: 64px;
        line-height: 1;
      }

      /* 报数（fx.js countStamp，005）：数字砸在滑块刚到的那一头，往左飘开。最后 3 下（或八拍的 8）大一号、变红 */
      .fx-count .sticker {
        --sticker-fill: var(--c-cream);
        --r: 4px;
        --shadow-x: 4px;
        --shadow-y: 5px;

        font-family: var(--font-num);
        font-size: 46px;
        line-height: 1;
      }

      .fx-count--big .sticker {
        --sticker-fill: var(--c-vermilion);

        font-size: 62px;
      }

      /* 啦啦队的八拍：应援蓝 */
      .fx-count--cheer .sticker {
        --sticker-fill: #5aa9ff;
      }

      .fx-count--cheer.fx-count--big .sticker {
        --sticker-fill: var(--fx-pink);
      }

      .fx-confetti {
        position: absolute;
        width: 7px;
        height: 11px;
        border-radius: 2px;
      }

      /* 呼吸（fx.js breathSync）：四周一圈粉紫光一胀一缩；中间偏下「吸——」「呼——」 */
      .fx-layer > .fx-breath {
        inset: 0;
        background: radial-gradient(ellipse 72% 62% at 50% 48%, transparent 50%, rgb(255 111 174 / 0.45) 78%, rgb(168 107 255 / 0.7) 100%);
        opacity: 0;
        will-change: opacity, transform;
      }

      .fx-breath-word {
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }

      .fx-breath-word .sticker {
        --sticker-fill: #fff0f7;
        --r: 3px;

        font-size: clamp(40px, 12vw, 60px);
        font-weight: 900;
        filter: drop-shadow(0 0 12px rgb(255 111 174 / 0.8));
      }

      .fl-order > .sticker {
        --r: 4px;
        --shadow-x: 6px;
        --shadow-y: 7px;

        font-size: clamp(34px, 10.5vw, 58px);
        font-weight: 900;
        line-height: 1.15;
        white-space: normal;
        /* 折成两行时分匀，别剩一两个字在第二行（日语、英语的命令比中文长）。
           中日文只在标点、空格处折（keep-all），不从词中间断开——日语的命令想在哪儿折就在那儿写一个空格；一段实在太长才随处折 */
        text-wrap: balance;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      /*
       * 竖排＝主人公（你）的心声，和她的粉紫发光字分开：墨色竖条（实色投影）+ 米白描边字，
       * 底下拖一串往画面下方（玩家那边）越来越小的思考泡泡——漫画里「这是心里想的」的记号，不用写字。
       * 魅了越深字越往粉里染、泛粉光、发抖，泡泡也泛粉（fx.js 按魅了写 --fl-color / --fl-glow / --corrupt / data-tremble）
       */
      .fl-heart {
        --corrupt: 0;
        --trail: 1; /* 泡泡往哪边偏：左边的竖条往右下，右边的往左下 */

        padding: 14px 5px;
        border: 2px solid var(--c-ink);
        border-radius: 999px;
        background: rgb(11 11 18 / 0.76);
        box-shadow: 3px 3px 0 var(--c-ink);
        translate: -50% 0;
        transform-origin: 50% 0;
      }

      .fl-heart[data-side='right'] {
        --trail: -1;
      }

      .fl-heart::before,
      .fl-heart::after {
        content: '';
        position: absolute;
        left: 50%;
        border: 2px solid var(--c-ink);
        border-radius: 50%;
        background: rgb(11 11 18 / 0.76);
        box-shadow:
          2px 2px 0 var(--c-ink),
          0 0 calc(var(--corrupt) * 10px) rgb(255 111 174 / var(--corrupt));
      }

      .fl-heart::before {
        width: 14px;
        height: 14px;
        bottom: -20px;
        translate: calc(-50% + var(--trail) * 7px) 0;
      }

      .fl-heart::after {
        width: 9px;
        height: 9px;
        bottom: -34px;
        translate: calc(-50% + var(--trail) * 15px) 0;
      }

      .fl-heart-text {
        letter-spacing: 0.16em;
        line-height: 1.05;
        writing-mode: vertical-rl;
      }

      /*
       * 手机（窄屏）上心声就固定成一条窄的墨色竖条，字比条宽、露在两边（站主 2026-09-18：喜欢这个样子，
       * 而且不要像原来那样到快消失时才变成包住整列字的宽度）。条的宽度写死，不跟着字体和排版量出来的宽度变
       */
      @media (max-width: 560px) {
        .fl-heart {
          display: flex;
          justify-content: center;
          width: 15px;
          padding-inline: 0;
        }

        .fl-heart-text {
          flex: none;
        }
      }

      .fl-heart[data-tremble='1'] .fl-heart-text {
        animation: heart-tremble 0.14s steps(2, jump-none) infinite;
      }

      @keyframes heart-tremble {
        from {
          translate: -0.7px 0.4px;
        }

        to {
          translate: 0.7px -0.5px;
        }
      }

      .fl-thought {
        white-space: nowrap;
      }

      /* 数到 0 的余韵：「0」放大一下再回来、发光（fx.js 的 finish 同时放心形环和柔光） */
      .clock--finish {
        --sticker-fill: var(--fx-pink);

        animation: clock-finish 1.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }

      @keyframes clock-finish {
        0% {
          scale: 1;
          filter: drop-shadow(0 0 0 rgb(255 111 174 / 0));
        }
        25% {
          scale: 1.28;
          filter: drop-shadow(0 0 22px rgb(255 111 174 / 0.95));
        }
        60% {
          scale: 1.08;
          filter: drop-shadow(0 0 14px rgb(255 111 174 / 0.7));
        }
        100% {
          scale: 1;
          filter: drop-shadow(0 0 6px rgb(255 111 174 / 0.4));
        }
      }

      .fx-afterglow {
        inset: 0;
        background: radial-gradient(circle at var(--gx) var(--gy), rgb(255 200 230 / 0.7), rgb(255 111 174 / 0.28) 30%, rgb(160 90 255 / 0.1) 60%, transparent 85%);
      }

      /* 时钟：倒计时最后几秒变粉 */
      .clock--allure {
        --sticker-fill: var(--fx-pink);

        filter: drop-shadow(0 0 14px rgb(255 111 174 / 0.8));
      }

      /* 败北处决（fx.js「败北处决」）：秒数变成魅了紫、每秒一跳；数到 0 变紫黑、粉色辉光 */
      .clock--exec {
        --sticker-fill: #c9a0ff;

        filter: drop-shadow(0 0 16px rgb(168 107 255 / 0.85));
        animation: clock-exec 1s ease-out infinite;
      }

      @keyframes clock-exec {
        0% {
          scale: 1.16;
        }
        30%,
        100% {
          scale: 1;
        }
      }

      .clock--exec-zero {
        animation: clock-exec-zero 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }

      @keyframes clock-exec-zero {
        0% {
          scale: 1.6;
          filter: drop-shadow(0 0 0 rgb(168 107 255 / 0));
        }
        22% {
          scale: 0.92;
          filter: drop-shadow(0 0 30px rgb(168 107 255 / 1));
        }
        100% {
          scale: 1;
          filter: drop-shadow(0 0 16px rgb(255 61 139 / 0.8));
        }
      }

      /* 紫黑的字：填色紫黑、描边换成粉、投影换成紫（像黑色的心） */
      :is(.clock--exec-zero, .fl-shout--fall .sticker, .app:is([data-screen='executed'], [data-screen='end']) .big-title .sticker) {
        --sticker-fill: #1c0b1e;
        --c-ink: #ff6fae;
      }

      :is(.clock--exec-zero, .fl-shout--fall .sticker, .app:is([data-screen='executed'], [data-screen='end']) .big-title .sticker)::before {
        --c-ink: #5b2a9e;
      }

      .app:is([data-screen='executed'], [data-screen='end']) .big-title .tag {
        background: #1c0b1e;
        color: #ffd3e8;
      }

      /* 数到 0：四周压下来的紫黑暗幕（魅了层里，留到结算）；全屏硬闪 */
      .fx-fall {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 60% at 50% 42%, transparent 20%, rgb(43 13 51 / 0.72) 68%, rgb(10 3 12 / 0.95) 100%);
        pointer-events: none;
      }

      .fx-strobe {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* 顺序题点到诱饵：全屏混乱（fx.js confuse）。压在题（16）上面，不挡手指 */
      .fx-confuse {
        position: absolute;
        inset: 0;
        z-index: 17;
        overflow: hidden;
        pointer-events: none;
      }

      .fx-confuse-tint {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 75% at 50% 45%, rgb(120 50 190 / 0.32), rgb(60 15 100 / 0.6) 65%, rgb(28 11 30 / 0.85));
      }

      .fx-confuse-ghost {
        position: absolute;
        left: 50%;
        top: 40%;
        height: 100%;
        width: auto;
        max-width: none;
        mix-blend-mode: screen;
        filter: blur(1.5px) hue-rotate(-50deg) saturate(1.6);
        transform: translate(-50%, -50%) scale(1.9);
      }

      /* 顺序题点到 0：粉色从四边往里渗（中间透明，不整屏变亮） */
      .fx-daze {
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 45%, rgb(255 111 174 / 0.35) 72%, rgb(255 61 139 / 0.7) 100%);
      }

      /* 超时（003）：秒数写成 0.01 这种长的，字号收小一点 */
      .clock--long {
        font-size: 92px;
      }

      /* 超时（005）：秒数那一格换成言责词——粉色、歪一点、字号按四个字放得下收小 */
      .clock--word {
        --sticker-fill: var(--fx-pink);

        font-size: 58px;
        letter-spacing: 0;
        white-space: nowrap;
        rotate: -6deg;
        filter: drop-shadow(0 0 12px rgb(255 111 174 / 0.75));
      }

      /* 视频 cut-in（fx.js vclip）：和胸部特写同一个斜切大框，竖视频铺满 */
      .vclip {
        --shape: polygon(7% 0, 100% 0, 100% 100%, 0 100%);

        position: absolute;
        top: calc(var(--hud-h) + 8px);
        bottom: calc(100% - var(--say-top) + 10px);
        right: 30px;
        z-index: 14;
        width: min(88%, calc(100% - 42px));
        pointer-events: none;
      }

      /* 视频开着时，秒数和节奏轨压在框上面（框大了会盖住它们） */
      .app[data-vclip] .clock,
      .app[data-vclip] .rhythm {
        z-index: 15;
      }

      .vclip-ghost {
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .vclip-canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 30%;
      }

      .vclip-bloom {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgb(255 245 250 / 0.95), rgb(255 111 174 / 0.7) 45%, rgb(168 107 255 / 0.3) 80%, transparent);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      /* 秒数卡住时憋住的那一下（fx.js strainFx） */
      .clock--strain {
        --sticker-fill: var(--fx-pink);

        filter: drop-shadow(0 0 16px rgb(255 111 174 / 0.9));
      }

      .vclip[data-side='left'] {
        --shape: polygon(0 0, 93% 0, 100% 100%, 0 100%);

        left: 0;
        right: auto;
      }

      .vclip[hidden] {
        display: none;
      }

      .vclip video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 30%;
      }

      .vclip[data-side='left'] .closeup-line {
        left: auto;
        right: 4%;
      }

      /* 奖励 cut-in：字条抬到框的下四分之一，不被左下角的秒数大字压住 */
      .vclip[data-reward] .closeup-line {
        bottom: 17%;
      }

      .vclip video[hidden],
      .vclip-still[hidden] {
        display: none;
      }

      .vclip-still {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 25%;
        transform-origin: 50% 30%;
      }

      /* 静图写了 focus（奖励 cut-in）：fx.js focusStill 按原图像素摆好大小和位置 */
      .vclip-still--focus {
        position: absolute;
        max-width: none;
        object-fit: fill;
      }

      /* ---- cut-in 的几种呈现（fx.js vclip 的 show，站主 2026-09-23）---- */
      /* 横条：一道斜切的宽横条横穿画面，只露焦点那一小块 */
      .vclip[data-show='band'] {
        --shape: polygon(0 16%, 100% 0, 100% 84%, 0 100%);

        top: 30%;
        bottom: auto;
        left: 0;
        right: 0;
        width: auto;
        height: 27%;
      }

      .vclip[data-show='band'][data-side='left'] {
        --shape: polygon(0 0, 100% 16%, 100% 100%, 0 84%);
      }

      .vclip[data-show='band'] .closeup-line {
        bottom: -24px;
      }

      /* 心形窗：从中间弹出来；粉色的边是底下那层心露出来的一圈 */
      .vclip[data-show='heart'] {
        --shape: polygon(50% 23.9%, 50.1% 22.7%, 50.9% 19.4%, 52.8% 14.6%, 56.2% 9.2%, 61.3% 4.4%, 67.7% 1.1%, 75% 0, 82.5% 1.5%, 89.4% 5.4%, 95.1% 11.5%, 98.7% 19%, 100% 27.4%, 98.7% 36%, 95.1% 44.5%, 89.4% 52.6%, 82.5% 60.2%, 75% 67.5%, 67.7% 74.4%, 61.3% 81%, 56.2% 87.1%, 52.8% 92.3%, 50.9% 96.4%, 50.1% 99.1%, 50% 100%, 49.9% 99.1%, 49.1% 96.4%, 47.2% 92.3%, 43.8% 87.1%, 38.7% 81%, 32.3% 74.4%, 25% 67.5%, 17.5% 60.2%, 10.6% 52.6%, 4.9% 44.5%, 1.3% 36%, 0 27.4%, 1.3% 19%, 4.9% 11.5%, 10.6% 5.4%, 17.5% 1.5%, 25% 0, 32.3% 1.1%, 38.7% 4.4%, 43.7% 9.2%, 47.2% 14.6%, 49.1% 19.4%, 49.9% 22.7%);

        top: 17%;
        bottom: auto;
        left: 0;
        right: 0;
        width: min(94%, 52vh);
        height: auto;
        aspect-ratio: 1.106;
        margin-inline: auto;
      }

      .vclip[data-show='heart'] .closeup-edge {
        background: linear-gradient(160deg, #fff0f7, var(--fx-pink) 45%, #c2185b);
      }

      .vclip[data-show='heart'] .closeup-media {
        inset: 7px;
      }

      .vclip[data-show='heart'] .closeup-line,
      .vclip[data-show='heart'][data-side='left'] .closeup-line {
        left: 50%;
        right: auto;
        bottom: -10px;
        translate: -50% 0;
        white-space: nowrap;
      }

      /* 整屏：HUD 下面一直铺到放弃按钮上面、左右到边，边框加粗（第 2 组的猛踩） */
      .vclip[data-show='full'] {
        --shape: polygon(3% 0, 100% 0, 97% 100%, 0 100%);

        top: calc(var(--hud-h) + 2px);
        bottom: calc(var(--say-bottom) - 2px);
        left: 0;
        right: 0;
        width: auto;
      }

      .vclip[data-show='full'] .closeup-edge {
        background: linear-gradient(135deg, #fff0f7, var(--fx-pink) 30%, var(--c-ink) 62%);
      }

      .vclip[data-show='full'] .closeup-media {
        inset: 8px;
      }

      .vclip[data-show='full'] .closeup-line {
        bottom: 14%;
      }

      /* 上下双格：上格从右边进、下格从左边进，两格之间一道斜缝（上格的下沿和下格的上沿平行） */
      .vclip[data-show='split-a'],
      .vclip[data-show='split-b'] {
        width: 94%;
        height: calc((var(--say-top) - var(--hud-h) - 18px) * 0.56);
      }

      .vclip[data-show='split-a'] {
        --shape: polygon(7% 0, 100% 0, 100% 78%, 0 100%);

        bottom: auto;
        right: 0;
      }

      .vclip[data-show='split-b'] {
        --shape: polygon(0 22%, 100% 0, 93% 100%, 0 100%);

        top: auto;
        left: 0;
        right: auto;
      }

      .vclip[data-show='split-a'] .closeup-line {
        top: 10px;
        bottom: auto;
        left: 12%;
      }

      /* 让位：前一个 cut-in 的残影往自己那一边滑出去 */
      .vclip-leave {
        pointer-events: none;
      }

      /* 踩中那一下的白光 */
      .vclip-bloom--white {
        background: radial-gradient(ellipse at 50% 55%, rgb(255 255 255 / 0.95), rgb(255 255 255 / 0.55) 50%, transparent 80%);
      }

      /* ================= 诱惑放弃（fx.js quitLure）================= */
      /* 按钮本身：整个变成粉色，一下一下鼓动，外面一圈粉色辉光 */
      .quit[data-lure] > button {
        animation: lure-throb 0.9s ease-in-out infinite;
        filter: drop-shadow(0 0 8px #ff6fae) drop-shadow(0 0 22px rgb(255 61 139 / 0.75));
      }

      .quit[data-lure] .quit-bar {
        --slab-bg: #ff3d8b;
      }

      .quit[data-lure] .quit-bar .sticker {
        --sticker-fill: #fff0f7;
      }

      .quit[data-lure] .quit-pill {
        border-color: #5a0f35;
        background: #ff6fae;
        color: #fff0f7;
      }

      @keyframes lure-throb {
        0%,
        100% {
          scale: 1;
        }
        35% {
          scale: 1.06;
        }
        55% {
          scale: 0.99;
        }
      }

      /* 垫在按钮后面的一层（光芒、辉光、往上冒的火花）：叠在上面会把按钮上的字冲淡 */
      .quit-lure {
        position: absolute;
        z-index: 6;
        pointer-events: none;
      }

      /* 扫光画在按钮自己身上（裁成按钮的形状） */
      .quit[data-lure] .quit-bar::after,
      .quit[data-lure] .quit-pill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 42%, rgb(255 255 255 / 0.55) 50%, transparent 58%) 0 0 / 260% 100%;
        pointer-events: none;
        animation: ql-shine-bg 1.6s ease-in-out infinite;
      }

      .quit[data-lure] .quit-bar::after {
        clip-path: var(--shape);
      }

      .quit[data-lure] .quit-pill::after {
        border-radius: 999px;
      }

      @keyframes ql-shine-bg {
        0% {
          background-position: 130% 0;
        }
        60%,
        100% {
          background-position: -30% 0;
        }
      }

      .quit-lure[hidden] {
        display: none;
      }

      .quit-lure > i,
      .quit-lure > span {
        position: absolute;
        pointer-events: none;
      }

      .ql-rays {
        left: 50%;
        top: 50%;
        width: 170%;
        aspect-ratio: 1;
        translate: -50% -50%;
        background: repeating-conic-gradient(from 0deg, transparent 0deg 8deg, rgb(255 111 174 / 0.55) 8deg 11deg, transparent 11deg 20deg);
        -webkit-mask-image: radial-gradient(circle, transparent 12%, #000 22%, transparent 55%);
        mask-image: radial-gradient(circle, transparent 12%, #000 22%, transparent 55%);
        mix-blend-mode: screen;
        animation: ql-spin 7s linear infinite;
      }

      .ql-glow {
        inset: -22% -6%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(255 111 174 / 0.75), rgb(255 61 139 / 0.3) 55%, transparent);
        mix-blend-mode: screen;
        animation: ql-glow 0.9s ease-in-out infinite;
      }

      .ql-sparks {
        inset: 0;
      }

      .ql-sparks b {
        position: absolute;
        bottom: 92%;
        width: 6px;
        height: 6px;
        background: #fff0f7;
        box-shadow: 0 0 8px #ff6fae;
        clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        opacity: 0;
        animation: ql-spark 1.4s ease-out infinite;
      }

      .ql-sparks b:nth-child(1) { left: 12%; animation-delay: 0s; }
      .ql-sparks b:nth-child(2) { left: 28%; animation-delay: 0.5s; }
      .ql-sparks b:nth-child(3) { left: 44%; animation-delay: 0.2s; }
      .ql-sparks b:nth-child(4) { left: 60%; animation-delay: 0.8s; }
      .ql-sparks b:nth-child(5) { left: 76%; animation-delay: 0.35s; }
      .ql-sparks b:nth-child(6) { left: 90%; animation-delay: 1s; }

      /* 「0」压在按钮右上角（在按钮正上方会盖住台词条的字） */
      /* 按钮上的字一个接一个跳（fx.js hopText 拆字），一圈 1.6 秒，循环 */
      .ql-word {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .ql-word .ql-ch {
        display: inline-block;
        letter-spacing: 0;
        animation: ql-hop 1.6s cubic-bezier(.3,.7,.3,1) infinite;
        animation-delay: calc(var(--i) * 0.18s);
      }

      @keyframes ql-hop {
        0%,
        28%,
        100% {
          translate: 0 0;
          scale: 1;
        }
        10% {
          translate: 0 -10px;
          scale: 1.4;
        }
        19% {
          translate: 0 1px;
          scale: 0.94;
        }
      }

      @keyframes ql-spin {
        to {
          rotate: 360deg;
        }
      }

      @keyframes ql-glow {
        0%,
        100% {
          opacity: 0.55;
          scale: 0.95;
        }
        35% {
          opacity: 1;
          scale: 1.08;
        }
      }

      @keyframes ql-spark {
        0% {
          opacity: 0;
          translate: 0 10px;
          scale: 0.4;
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          translate: 0 -46px;
          scale: 1.1;
        }
      }

      /* 大号余韵（fx.js grandFinish）：秒数那里爆开的粉金色光芒、飘下来的星星、「0」的残影 */
      .fx-grand-rays {
        width: 260vmax;
        aspect-ratio: 1;
        translate: -50% -50%;
        background: repeating-conic-gradient(from 0deg, transparent 0deg 7deg, rgb(255 111 174 / 0.5) 7deg 9deg, transparent 9deg 14deg, rgb(255 215 106 / 0.45) 14deg 15deg, transparent 15deg 20deg);
        -webkit-mask-image: radial-gradient(circle, transparent 2%, #000 8%, rgb(0 0 0 / 0.5) 22%, transparent 40%);
        mask-image: radial-gradient(circle, transparent 2%, #000 8%, rgb(0 0 0 / 0.5) 22%, transparent 40%);
        mix-blend-mode: screen;
      }

      .fx-star {
        width: 14px;
        height: 14px;
        background: var(--star, #ff6fae);
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        filter: drop-shadow(0 0 6px var(--star, #ff6fae));
      }

      .fx-zero-ghost {
        mix-blend-mode: screen;
        filter: drop-shadow(0 0 18px rgb(255 111 174 / 0.9));
      }

      @media (prefers-reduced-motion: reduce) {
        .quit[data-lure] > button,
        .quit[data-lure] > button::after,
        .quit-lure *,
        .ql-word .ql-ch,
        .quit-bar-inner.is-beat {
          animation: none !important;
        }
      }

      /* 往回涨（fx.js rewindFx）：倒带的横纹往上刷 + 「◀◀」 */
      .fx-rewind {
        width: 100%;
        height: 100%;
        background:
          linear-gradient(to bottom, transparent 0 46%, rgb(255 245 225 / 0.22) 46% 49%, transparent 49% 100%) 0 0 / 100% 38%,
          repeating-linear-gradient(to bottom, rgb(11 11 18 / 0.18) 0 2px, transparent 2px 5px);
        mix-blend-mode: hard-light;
        animation: fx-rewind 0.35s linear infinite;
      }

      @keyframes fx-rewind {
        to {
          background-position: 0 -38%, 0 0;
        }
      }

      .fx-rewind-mark {
        translate: -50% -50%;
        font-family: var(--font-num);
        font-size: 40px;
      }

      .fx-rewind-mark .sticker {
        --sticker-fill: var(--fx-pink);
        --r: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .quit-zero .sticker {
          animation: none;
        }
      }

      /* 冲击环（fx.js pulseRing）：细亮边 + 外面一圈暗色厚边 + 辉光 */
      .fx-pulse {
        border: var(--pulse-w, 3px) solid var(--pulse-color);
        border-radius: 50%;
        box-shadow:
          0 0 14px var(--pulse-color),
          inset 0 0 12px var(--pulse-color),
          0 0 0 calc(var(--pulse-w, 3px) * 2.5) var(--pulse-core);
        transform: translate(-50%, -50%);
      }

      /* 数到 0 之后：紫色细光线从画面中间放射、慢慢转（魅了层里，留到结算） */
      .fx-rays {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 320%;
        aspect-ratio: 1;
        translate: -50% -50%;
        background: repeating-conic-gradient(from 0deg, transparent 0deg 6deg, rgb(168 107 255 / 0.55) 6deg 7.2deg, transparent 7.2deg 11deg, rgb(255 111 174 / 0.32) 11deg 11.6deg, transparent 11.6deg 15deg);
        -webkit-mask-image: radial-gradient(circle, transparent 5%, #000 16%, rgb(0 0 0 / 0.55) 30%, transparent 46%);
        mask-image: radial-gradient(circle, transparent 5%, #000 16%, rgb(0 0 0 / 0.55) 30%, transparent 46%);
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
      }

      /* 处决归零的大字：紫黑字 + 粉紫辉光 */
      .fl-shout--fall .sticker {
        filter: drop-shadow(0 0 16px rgb(168 107 255 / 0.9));
      }

      @media (prefers-reduced-motion: reduce) {
        .clock--exec,
        .clock--exec-zero {
          animation: none;
        }
      }

      /* 魅惑闪光的 DOM 备用（没有 WebGL 时）：同一张图放大半透明发散 */
      .fx-ghost {
        mix-blend-mode: screen;
        filter: saturate(1.3) hue-rotate(-12deg) brightness(1.2);
      }

      .fx-flash {
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #fff 0, rgb(255 190 225 / 0.9) 40%, rgb(255 111 174 / 0.4) 100%);
      }

      /* 心形（实心 / 环）：颜色和发光由 fx.95ba3bedf1.js 写在行内 */
      .fx-h svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* 心章：发光的心形纹章（fx.js crestSvg）。不描边：软边实心笔画 + 粉紫两层发光 + 模糊亮芯，一笔一笔描出来 */
      .fx-crest {
        aspect-ratio: 300 / 230;
      }

      .fx-crest svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* 心章（彩带版）：带子上贴着一边走的亮线；中间心形光按自己的中心缩放 */
      .crest-sheen {
        fill: #fff3fa;
        opacity: 0.85;
      }

      .crest-halo {
        opacity: 0.7;
      }

      .crest-heart {
        transform-box: fill-box;
        transform-origin: center;
      }

      .crest-star {
        fill: #fff4fb;
        transform-box: fill-box;
        transform-origin: center;
      }

      /* 唇印：程序画的口红印图，不描边；黑色的带一点粉色外发光，暗处也看得出 */
      .fx-lips {
        width: 124px;
        height: auto;
      }

      .fx-lips--dark {
        filter: drop-shadow(0 0 4px rgb(255 111 174 / 0.7));
      }

      .fx-focus {
        inset: 0;
      }

      .fx-focus svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .fx-mist {
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 205 230 / 0.85) 0, rgb(255 150 200 / 0.45) 40%, transparent 70%);
        filter: blur(6px);
      }

      /* 委托单画面：立绘眼睛上的黑条（fx.js，位置按立绘档案 fx.eyeBar）；放在立绘同一个框里，跟着整图呼吸 */
      .eye-bar {
        position: absolute;
        z-index: 2;
        pointer-events: none;
      }

      .eye-bar svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .eye-bar[hidden] {
        display: none;
      }

      /* 特写 cut-in：胸＝右侧斜切大框；眼＝横贯画面的细长条 */
      .closeup {
        --shape: polygon(8% 0, 100% 0, 100% 100%, 0 100%);

        position: absolute;
        top: 16%;
        /* 右边让出节奏滑轨 */
        right: 50px;
        z-index: 14;
        width: min(78%, calc(100% - 64px));
        height: 44%;
        pointer-events: none;
      }

      /* 吸取中的那一条（定时演出写了 tight，007）：框比平时大一圈（站主 2026-10-18：看起来还是原来的尺寸） */
      .closeup[data-tight] {
        top: 11%;
        right: 44px;
        width: min(92%, calc(100% - 52px));
        height: 54%;
      }

      /* 臀：从突出的那一边切进来（data-side）；右边的和胸同位置，左边的斜切方向反过来 */
      .closeup[data-part='hips'] {
        top: 20%;
        height: 40%;
      }

      .closeup[data-part='hips'][data-side='left'] {
        --shape: polygon(0 0, 92% 0, 100% 100%, 0 100%);

        left: 0;
        right: auto;
      }

      .closeup[data-part='hips'][data-side='left'] .closeup-line {
        left: auto;
        right: 4%;
      }

      /* 腿（晃腿）：翘起来的那条腿在图的左边，从左边切进来，斜切方向同左边的臀 */
      .closeup[data-part='legs'] {
        --shape: polygon(0 0, 92% 0, 100% 100%, 0 100%);

        top: 18%;
        left: 0;
        right: auto;
        height: 46%;
      }

      .closeup[data-part='legs'] .closeup-line {
        left: auto;
        right: 4%;
      }

      .closeup[data-part='eyes'],
      .closeup[data-part='lips'] {
        --shape: polygon(0 12%, 100% 0, 100% 88%, 0 100%);

        top: 24%;
        left: 0;
        right: 50px;
        width: auto;
        height: 17%;
      }

      .closeup-edge,
      .closeup-media {
        position: absolute;
        clip-path: var(--shape);
      }

      .closeup-edge {
        inset: 0;
        background: linear-gradient(135deg, var(--fx-pink), var(--c-ink) 40%);
      }

      .closeup-media {
        inset: 4px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #3a1740, var(--c-navy-deep));
      }

      .closeup canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .closeup-line {
        position: absolute;
        bottom: -20px;
        left: 4%;
        margin: 0;
      }

      .closeup[data-part='eyes'] .closeup-line,
      .closeup[data-part='lips'] .closeup-line {
        left: auto;
        right: 6%;
        bottom: -26px;
      }

      .closeup-line .sticker {
        --sticker-fill: var(--fx-pink);
        --r: 3px;
        --shadow-x: 4px;
        --shadow-y: 5px;

        font-size: 26px;
        font-weight: 900;
      }

      /* ================= 减少动态：常驻的动效全关；进度类（长按填充、指示器位置）保留 ================= */
      @media (prefers-reduced-motion: reduce) {
        .art-img,
        .burst,
        .adv-next,
        .choice--main::before {
          animation: none;
        }

        .fl-whisper span,
        .fl-heart-text span,
        .fl-thought span {
          animation: none;
          opacity: 1;
        }

        .fl-heart[data-tremble='1'] .fl-heart-text {
          animation: none;
        }

        .quit > button,
        .quit[data-state] > button,
        .stand {
          transition: none !important;
        }
      }

      /*
       * ================= 催眠（006 催眠术师）=================
       * 洗脑进度条、开关面板、环字、字墙、空白——魅惑演出层（包内例外），样子照下酒菜「催眠螺旋」的文字层：
       * 半透明暗底、螺旋主色的边和光晕、发光的字。颜色只取螺旋的两个颜色（粉 / 墨黑），只在这几样上用。fx.js「催眠」一节
       */
      .hy-bar,
      .hy-sw,
      .hy-ring,
      .hy-wall {
        --hy1: #ff5fa8;
        --hy2: #0b0b12;
        --hy-hot: #ffafd4;
        --hy-pane: rgb(11 11 18 / 0.82);
        --hy-glow: rgb(255 95 168 / 0.65);

        font-weight: 900;
        pointer-events: none;
      }

      /* 进度条：平时收在 HUD 后面，弹下来报个数（左边贴着，右边让开节奏轨） */
      .hy-bar {
        position: absolute;
        left: 12px;
        right: 96px;
        top: calc(var(--hud-h) + 12px);
        z-index: 7;
        padding: 5px 10px 9px;
        border: 1px solid var(--hy1);
        background: var(--hy-pane);
        box-shadow: 0 0 12px var(--hy-glow);
        color: var(--hy-hot);
        font-size: 12px;
        opacity: 0;
        translate: 0 -150%;
        transition:
          translate 280ms cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 200ms;
      }

      .hy-bar.is-on {
        opacity: 1;
        translate: 0 0;
      }

      /* 败北处决：压在整屏的 cut-in 上面（数到 0 的「洗脑完成」要看得见） */
      .app:is([data-screen='execute'], [data-screen='executed']) .hy-bar {
        z-index: 16;
      }

      /* ---------- 冒险者卡（card.js，007 起：等级跨组继承，降到 0 就输）---------- */
      .card-hud {
        position: absolute;
        left: 12px;
        top: calc(var(--hud-h) + 12px);
        z-index: 7;
        width: 150px;
        pointer-events: none;
        opacity: 0;
        translate: -130% 0;
        transition:
          opacity 220ms,
          translate 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .card-hud.is-on {
        opacity: 1;
        translate: 0 0;
      }

      .app[data-stay='drain'] .card-hud {
        z-index: 15;
      }

      /*
       * 无尽战斗的冒险者卡（站主 2026-10-19：原来压住了左上角的「无尽模式」牌）：挪到牌子下面，紫黑的底、等级字母换成 ∞；
       * 只有无尽里等级能吸到负数，负的时候称号那一行写欠下几级（card.js）
       */
      .card-hud.is-endless {
        top: calc(var(--hud-h) + 86px);
      }

      .card-hud.is-endless .card-hud-body {
        background: #1c0b1e;
        color: var(--c-cream);
      }

      .card-hud.is-endless .card-hud-name {
        color: #ff9cc9;
      }

      .card-hud.is-endless .card-hud-title {
        color: #c9a0ff;
      }

      .card-hud.is-endless .card-hud-rank {
        background: var(--c-vermilion);
        color: var(--c-cream);
      }

      .card-hud.is-endless .card-hud-num,
      .card-hud.is-endless .card-hud-lv small {
        color: #ff6fae;
      }

      .card-hud.is-endless.is-debt .card-hud-num {
        color: var(--c-vermilion);
      }

      /*
       * 逗留里按「长按通过」时她挡上来的图（game.js 的 stayCover，007 第 2、4 组）：从下面升上来，盖住长按的那一条——
       * 第 2 组盖一下就走，第 4 组按着的时候一直挡着（看不到进度条，只能一直按）
       */
      .stay-cover {
        --frame: polygon(0 7%, 100% 0, 100% 100%, 0 100%);

        position: absolute;
        left: 2%;
        right: 2%;
        bottom: calc(6px + var(--safe-bottom));
        z-index: 13;
        height: 36%;
        background: var(--c-ink);
        clip-path: var(--frame);
        filter: drop-shadow(4px 5px 0 rgb(11 11 18 / 0.5));
        translate: 0 110%;
        transition: translate 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
      }

      .stay-cover.is-on {
        translate: 0 0;
      }

      /* 挡着的时候她的台词条浮在图上面（台词照常看得到，看不到的只有长按那一条） */
      .app.has-stay-cover .say {
        z-index: 14;
      }

      .stay-cover img {
        position: absolute;
        inset: 5px;
        width: calc(100% - 10px);
        height: calc(100% - 10px);
        max-width: none;
        object-fit: cover;
        clip-path: var(--frame);
      }

      .stay-cover-line {
        position: absolute;
        left: 50%;
        top: 14%;
        z-index: 1;
        margin: 0;
        font-size: 22px;
        white-space: nowrap;
        rotate: -5deg;
        translate: -50% 0;
      }

      .stay-cover-line .sticker {
        --sticker-fill: #ff6fae;
      }

      @media (prefers-reduced-motion: reduce) {
        .stay-cover {
          transition: none;
        }
      }

      /* 清空（等级被吸到 0 的那一场，card.js 的 stageOn）：卡被端到画面正中、放大两倍 */
      .card-hud.is-on.is-stage {
        left: 50%;
        top: 34%;
        z-index: 17;
        translate: -50% -50%;
        scale: 2;
        transition:
          opacity 220ms,
          translate 520ms cubic-bezier(0.3, 0.7, 0.2, 1),
          left 520ms cubic-bezier(0.3, 0.7, 0.2, 1),
          top 520ms cubic-bezier(0.3, 0.7, 0.2, 1),
          scale 520ms cubic-bezier(0.3, 0.7, 0.2, 1);
      }

      .card-hud.is-stage .card-hud-body {
        box-shadow:
          3px 3px 0 var(--c-ink),
          0 0 26px 10px rgb(176 90 255 / 0.7);
      }

      .card-hud-body {
        position: relative;
        padding: 6px 10px 8px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 7px;
        background: var(--c-cream);
        box-shadow: 3px 3px 0 var(--c-ink);
        color: var(--c-ink);
        rotate: -4deg;
        transition:
          translate 460ms cubic-bezier(0.3, 0.7, 0.3, 1),
          rotate 460ms cubic-bezier(0.3, 0.7, 0.3, 1),
          scale 460ms cubic-bezier(0.3, 0.7, 0.3, 1),
          box-shadow 200ms;
      }

      .card-hud-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin: 0;
      }

      .card-hud-name {
        min-width: 0;
        overflow: hidden;
        color: var(--c-ink);
        font-size: 14px;
        line-height: 1.3;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .card-hud-title {
        margin: 0 0 2px;
        overflow: hidden;
        color: #8a3cff;
        font-size: 10px;
        line-height: 1.3;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .card-hud-title[hidden] {
        display: none;
      }

      .card-hud-rank {
        min-width: 22px;
        padding: 0 5px;
        border-radius: 4px;
        background: var(--c-ink);
        color: var(--c-hud);
        font-family: var(--font-num);
        font-size: 13px;
        text-align: center;
      }

      .card-hud-lv {
        display: flex;
        align-items: baseline;
        gap: 4px;
        margin: 0;
        line-height: 1;
      }

      .card-hud-lv small {
        color: var(--c-navy);
        font-family: var(--font-num);
        font-size: 14px;
      }

      .card-hud-num {
        display: inline-block;
        color: var(--c-navy);
        font-family: var(--font-num);
        font-size: 34px;
      }

      .card-hud-bar {
        height: 6px;
        margin-top: 4px;
        overflow: hidden;
        border: 1.5px solid var(--c-ink);
        border-radius: 3px;
        background: var(--c-cream-dim);
      }

      .card-hud-bar i {
        display: block;
        height: 100%;
        background: var(--c-hud);
        transform-origin: left;
        transition: transform 160ms;
      }

      .card-hud-stamp {
        position: absolute;
        right: -10px;
        bottom: -12px;
        padding: 2px 8px;
        border: 2px solid var(--c-vermilion);
        border-radius: 4px;
        background: var(--c-cream);
        color: var(--c-vermilion);
        font-size: 13px;
        white-space: nowrap;
        rotate: -12deg;
        opacity: 0;
      }

      .card-hud.has-stamp .card-hud-stamp {
        opacity: 1;
      }

      .card-hud.is-low .card-hud-num {
        color: var(--c-vermilion);
      }

      .card-hud.is-low .card-hud-body {
        animation: card-low 0.9s ease-in-out infinite;
      }

      @keyframes card-low {
        50% {
          box-shadow:
            3px 3px 0 var(--c-ink),
            0 0 0 4px rgb(255 74 42 / 0.45);
        }
      }

      .card-hud.is-debt .card-hud-num {
        color: #8a3cff;
      }

      .card-hud.is-drain .card-hud-body {
        box-shadow:
          3px 3px 0 var(--c-ink),
          0 0 14px 4px rgb(176 90 255 / 0.75);
      }

      /* 被她拿走：卡飞到她手边（--held-x / --held-y，card.js 按画面算），原来那一格留个虚线框写「保管中」 */
      .card-hud-held {
        position: absolute;
        left: 0;
        top: 0;
        display: grid;
        place-items: center;
        width: 150px;
        height: 100%;
        border: 2px dashed var(--c-cream);
        border-radius: 7px;
        color: var(--c-cream);
        font-size: 13px;
        rotate: -4deg;
        opacity: 0;
        transition: opacity 200ms;
      }

      /* 挪卡（card.js 的 moveCard，007 第 4 组）：趁大的特写挡住画面时把卡挪到别处，后面的鞋印就往新的位置去 */
      .card-hud.is-moved .card-hud-body {
        translate: var(--move-x, 0) var(--move-y, 0);
        rotate: 5deg;
      }

      .card-hud.is-held .card-hud-held {
        opacity: 0.85;
      }

      .card-hud.is-held .card-hud-body {
        translate: var(--held-x, 180px) var(--held-y, 160px);
        rotate: 10deg;
        scale: 1.1;
      }

      .app:is([data-screen='execute'], [data-screen='executed']) .card-hud {
        z-index: 16;
      }

      /* 暂停画面：左上是「第 n 组 通过」的卡（结算单写在它下面），冒险者卡挪到它右边 */
      .app[data-screen='pause'] .card-hud {
        left: min(226px, calc(100% - 162px));
        top: calc(72px + var(--safe-top));
        z-index: 11;
      }

      .card-hud.is-sucked .card-hud-body {
        animation: card-sucked 0.62s ease-out;
      }

      @keyframes card-sucked {
        0% {
          box-shadow:
            3px 3px 0 var(--c-ink),
            0 0 0 0 rgb(176 90 255 / 0);
        }
        15% {
          box-shadow:
            3px 3px 0 var(--c-ink),
            0 0 22px 8px rgb(176 90 255 / 0.9);
        }
        100% {
          box-shadow:
            3px 3px 0 var(--c-ink),
            0 0 0 0 rgb(176 90 255 / 0);
        }
      }

      .card-suck {
        --sticker-fill: #c77dff;
        --r: 2.5px;

        position: absolute;
        z-index: 9;
        margin: -20px 0 0 -20px;
        font-family: var(--font-num);
        font-size: 34px;
        line-height: 1;
        pointer-events: none;
      }

      .card-wisp {
        position: absolute;
        z-index: 8;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0 18%, #c77dff 42%, rgb(140 60 255 / 0) 70%);
        pointer-events: none;
      }

      .card-ledger {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 2px dashed var(--c-grey-line);
        font-size: 12px;
      }

      .card-ledger-row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin: 2px 0;
      }

      .card-ledger-row b {
        color: var(--c-navy);
        font-family: var(--font-num);
        font-size: 15px;
      }

      .card-ledger-row.is-fee b {
        color: var(--c-vermilion);
      }

      .card-ledger-row.is-sum {
        margin-top: 4px;
        font-size: 13px;
      }

      .card-ledger-row.is-sum b {
        font-size: 18px;
      }

      /*
       * ---------- 卡的样子跟着冒险者等级变（card.js 的 data-tier：0 C · 1 D · 2 E · 3 M）----------
       * 她的口红印一档多一个；E 档整张卡染粉，M 档变成紫黑的卡（这几样是魅惑演出层的颜色：卡是被她调教的一部分）
       */
      .card-hud-marks {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .card-hud-mark {
        position: absolute;
        width: 40px;
        height: auto;
        max-width: none;
        opacity: 0.92;
      }

      .card-hud-mark--1 {
        right: -10px;
        top: -10px;
        rotate: 18deg;
      }

      .card-hud-mark--2 {
        left: 60px;
        bottom: -10px;
        width: 36px;
        rotate: -26deg;
      }

      .card-hud-mark--3 {
        right: 4px;
        bottom: 4px;
        width: 34px;
        rotate: 10deg;
      }

      .card-hud[data-tier='1'] .card-hud-rank {
        color: #ff6fae;
      }

      .card-hud[data-tier='2'] .card-hud-body {
        background: #ffe1ef;
      }

      .card-hud[data-tier='2'] .card-hud-rank,
      .card-hud[data-tier='3'] .card-hud-rank {
        background: #ff3d8b;
        color: var(--c-cream);
      }

      .card-hud[data-tier='2'] .card-hud-num,
      .card-hud[data-tier='2'] .card-hud-lv small {
        color: #c2186b;
      }

      .card-hud[data-tier='2'] .card-hud-bar i {
        background: #ff6fae;
      }

      .card-hud[data-tier='3'] .card-hud-body {
        background: #2a1033;
        color: var(--c-cream);
      }

      .card-hud[data-tier='3'] .card-hud-name {
        color: #ff9cc9;
      }

      .card-hud[data-tier='3'] .card-hud-title {
        color: #ffb8dc;
      }

      .card-hud[data-tier='3'] .card-hud-num {
        color: #ff6fae;
      }

      .card-hud[data-tier='3'] .card-hud-lv small {
        color: #c9a0ff;
      }

      .card-hud[data-tier='3'] .card-hud-bar {
        background: #46204f;
      }

      .card-hud[data-tier='3'] .card-hud-bar i {
        background: #ff3d8b;
      }

      /* 改名：旧名字上划一道线（card.js 停一下再换成新的） */
      .card-hud-name {
        position: relative;
      }

      .card-hud-name::after {
        content: '';
        position: absolute;
        left: -2px;
        right: -2px;
        top: 52%;
        height: 3px;
        border-radius: 2px;
        background: #ff3d8b;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 300ms cubic-bezier(0.3, 0.7, 0.3, 1);
      }

      .card-hud-name.is-struck::after {
        transform: scaleX(1);
      }

      .card-hud-name.is-long {
        font-size: 10.5px;
        letter-spacing: -0.3px;
      }

      /* 韩语版：「레벨 항아리 No.12848」比中文宽一成，照中文的字距会差 2px 被省略号截掉，再收紧一点 */
      :root:lang(ko) .card-hud-name.is-long {
        letter-spacing: -0.6px;
      }

      /* 踩到卡上（鞋印）：卡被踩扁一下，上面留一个鞋印、慢慢淡掉 */
      .card-hud-heel {
        position: absolute;
        left: 54%;
        top: 50%;
        width: 40px;
        height: 66px;
        margin: -33px 0 0 -20px;
        rotate: 24deg;
        opacity: 0;
        transition: opacity 900ms ease-in;
        pointer-events: none;
      }

      .card-hud-heel svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .card-hud.is-stomped .card-hud-heel {
        opacity: 0.85;
        transition: none;
      }


      /* 鞋印走到最后两步：卡外面一圈红框闪（快被踩到了） */
      .card-hud::after {
        content: '';
        position: absolute;
        inset: -6px;
        border: 3px solid var(--c-vermilion);
        border-radius: 11px;
        rotate: -4deg;
        opacity: 0;
        pointer-events: none;
      }

      .card-hud.is-threat::after {
        animation: card-threat 0.32s ease-in-out infinite alternate;
      }

      @keyframes card-threat {
        to {
          opacity: 1;
        }
      }

      /*
       * ---------- 吸取中（fx.js 的重影，007）：等级正在被吸的时候 ----------
       * 她胸部循环乳摇的重影铺满全屏、滤色叠上去、偏紫、糊一点（画布按一半分辨率画再放大两倍）；
       * 四周一圈紫色暗角。不透明度都由 fx.95ba3bedf1.js 每帧给（每吸走一级亮一下）
       */
      .drain-ghost {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        opacity: 0;
        mix-blend-mode: screen;
        filter: hue-rotate(-24deg) saturate(1.35) blur(1.2px);
        pointer-events: none;
      }

      .drain-ghost canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 50%;
        transform: scale(2);
        transform-origin: 0 0;
      }

      .drain-veil {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0;
        background: radial-gradient(ellipse 80% 70% at 50% 46%, rgb(150 60 240 / 0) 40%, rgb(150 60 240 / 0.32) 72%, rgb(70 10 130 / 0.62) 100%);
        pointer-events: none;
      }

      .drain-ghost[hidden],
      .drain-veil[hidden] {
        display: none;
      }

      /* ---------- 鞋印（card.js，007 第 3 组起）：从画面别处一步一步踩向冒险者卡，点掉就没事 ---------- */
      .print-layer {
        position: absolute;
        inset: 0;
        z-index: 16;
        pointer-events: none;
      }

      .print {
        position: absolute;
        width: 52px;
        height: 82px;
        margin: -41px 0 0 -26px;
        padding: 0;
        border: 0;
        background: none;
        pointer-events: auto;
        touch-action: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      /* 点得到的范围比鞋印大一圈 */
      .print::before {
        content: '';
        position: absolute;
        inset: -16px -22px;
      }

      .print svg {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .heel-shadow {
        fill: var(--c-ink);
      }

      .heel-sole {
        fill: #2a1033;
        stroke: #ff6fae;
        stroke-width: 4;
        stroke-linejoin: round;
      }

      .heel-heart {
        fill: #ff6fae;
      }

      .heel-tip {
        fill: #ff6fae;
        stroke: #ff6fae;
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .print.is-broken .heel-tip {
        fill: var(--c-cream);
        stroke: var(--c-ink);
      }

      .print--ghost {
        pointer-events: none;
      }

      .print--ghost .heel-shadow {
        display: none;
      }

      .print.is-broken .heel-sole {
        fill: var(--c-cream);
        stroke: var(--c-ink);
      }

      .print[disabled] {
        pointer-events: none;
      }

      /* 鞋印踩中卡（card.js 的 stompHit）：落点的星形冲击、往外扩的环、八道短线 */
      .print-hit {
        position: absolute;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        pointer-events: none;
      }

      .print-hit svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .print-hit svg * {
        transform-box: fill-box;
        transform-origin: center;
      }

      .print-hit-star {
        fill: #ff3d8b;
        stroke: var(--c-ink);
        stroke-width: 4;
        stroke-linejoin: round;
        opacity: 0;
      }

      .print-hit-ring {
        fill: none;
        stroke: #ff6fae;
        stroke-width: 5;
        opacity: 0;
      }

      .print-hit-lines {
        stroke: var(--c-ink);
        stroke-width: 5;
        stroke-linecap: round;
        opacity: 0;
      }

      .card-hud.is-hit .card-hud-body::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #ff3d8b;
        mix-blend-mode: multiply;
        opacity: 0;
        animation: card-hit 0.5s ease-out;
        pointer-events: none;
      }

      @keyframes card-hit {
        0% {
          opacity: 0.75;
        }
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card-hud.is-hit .card-hud-body::after {
          animation: none;
        }
      }

      /* 大鞋印（card.js 的 bigHeel，007 第 3 组逗留里打断「长按通过」）：踩在画面正中的一只，点不掉 */
      .print--big {
        pointer-events: none;
      }

      .print--big::before {
        content: none;
      }

      .print--big .heel-sole {
        stroke-width: 3;
      }

      .print-dust {
        position: absolute;
        width: 220px;
        height: 70px;
        margin: -35px 0 0 -110px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(255 246 230 / 0.75), rgb(255 246 230 / 0));
        pointer-events: none;
      }

      /* ---------- 连打打完露出来的「接受榨取」（challenge.js 的 trap: "accept"，007）：多点一下就被吸走几级 ---------- */
      .chal-accept {
        position: absolute;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        min-width: 128px;
        padding: 9px 14px 7px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 10px;
        background: #ff3d8b;
        box-shadow: 3px 4px 0 var(--c-ink);
        color: var(--c-ink);
        transform: translate(-50%, -50%);
        rotate: -4deg;
        pointer-events: auto;
        touch-action: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: accept-pulse 0.42s ease-in-out infinite alternate;
      }

      .chal-accept-word {
        font-size: 17px;
        white-space: nowrap;
      }

      .chal-accept-cost {
        font-family: var(--font-num);
        font-size: 16px;
        line-height: 1;
      }

      .chal-accept[disabled] {
        pointer-events: none;
      }

      @keyframes accept-pulse {
        to {
          scale: 1.07;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .chal-accept,
        .card-hud.is-threat::after {
          animation: none;
        }

        .card-hud.is-threat::after {
          opacity: 1;
        }
      }

      /* ---------- 逗留（超时步骤 do: stay，007 起）：秒数到 0 先给「通过」，留着不走就往下数（−1、−2……）---------- */
      .app[data-stay='drain'] .clock {
        --sticker-fill: #c77dff;
      }

      /* 长按的按钮从「放弃」换成「通过」：换成 HUD 绿 */
      .app[data-stay] .quit-bar {
        --slab-bg: var(--c-hud);
      }

      /* 刚进逗留：「长按通过」闪两下，看得到它变了 */
      .app[data-stay] .quit-bar-inner {
        animation: stay-quit 0.5s ease-out 2;
      }

      @keyframes stay-quit {
        40% {
          scale: 1.06;
        }
      }

      .stay-tag {
        position: absolute;
        left: 20px;
        top: calc(var(--say-top) - 112px);
        z-index: 5;
        display: none;
        padding: 3px 10px 4px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 4px;
        background: var(--c-hud);
        box-shadow: 2px 2px 0 var(--c-ink);
        color: var(--c-ink);
        line-height: 1.2;
        rotate: -6deg;
        translate: 0 -100%;
      }

      .stay-tag-main {
        display: block;
        font-size: 13px;
      }

      .stay-tag-rate {
        display: block;
        font-size: 11px;
        white-space: nowrap;
      }

      .app[data-stay='drain'] .stay-tag {
        z-index: 15;
        background: #c77dff;
      }

      .app[data-stay][data-screen='hold'] .stay-tag {
        display: block;
      }

      /* 剧情里的画面框（game.js 的 storyStill，007 开场）：压在立绘上、对话框下面 */
      .adv-still {
        --frame: polygon(0 3%, 100% 0, 100% 97%, 0 100%);

        position: absolute;
        left: 3%;
        right: 3%;
        top: calc(var(--safe-top) + 26px);
        bottom: calc(var(--box-bottom) + var(--box-h) + 16px);
        z-index: 3;
        background: var(--c-ink);
        clip-path: polygon(0 50%, 100% 50%, 100% 50%, 0 50%);
        opacity: 0;
        filter: drop-shadow(5px 6px 0 rgb(11 11 18 / 0.55));
        transition:
          clip-path 620ms cubic-bezier(0.3, 0.7, 0.2, 1),
          opacity 220ms;
        pointer-events: none;
      }

      .adv-still.is-on {
        clip-path: var(--frame);
        opacity: 1;
      }

      .adv-still[data-size='band'] {
        --frame: polygon(0 33%, 100% 28%, 100% 64%, 0 69%);
      }

      .adv-still-frame {
        position: absolute;
        inset: 5px;
        overflow: hidden;
        background: var(--c-navy-deep);
        clip-path: var(--frame);
        transition: clip-path 620ms cubic-bezier(0.3, 0.7, 0.2, 1);
      }

      .adv-still-frame img,
      .adv-still-frame video {
        position: absolute;
        left: 0;
        top: 0;
        max-width: none;
        transform-origin: 0 0;
      }

      .adv-still-frame [hidden] {
        display: none;
      }

      /* 剧情里登记名字（007 开场：做冒险者卡）：对话框上面一张小卡 */
      .adv-input {
        position: absolute;
        left: 50%;
        bottom: calc(var(--box-bottom) + var(--box-h) + 22px);
        z-index: 6;
        width: min(84%, 320px);
        margin: 0;
        padding: 20px 16px 14px;
        border: var(--stroke) solid var(--c-ink);
        border-radius: var(--radius-panel);
        background: var(--c-cream);
        box-shadow: 4px 5px 0 var(--c-ink);
        color: var(--c-ink);
        translate: -50% 0;
        rotate: -2deg;
      }

      .adv-input .stamp-tag {
        left: 12px;
        top: -12px;
        font-size: 12px;
      }

      .adv-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        font-size: 13px;
      }

      .adv-input-row input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 4px;
        background: #fff;
        color: var(--c-ink);
        font: inherit;
        font-size: 18px;
        -webkit-user-select: text;
        user-select: text;
      }

      .adv-input-ok {
        display: block;
        margin: 0 auto;
        padding: 8px 34px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 6px;
        background: var(--c-vermilion);
        box-shadow: 3px 3px 0 var(--c-ink);
        color: var(--c-cream);
        font: inherit;
        font-size: 17px;
        letter-spacing: 4px;
        transform: skewX(var(--skew-button));
        cursor: pointer;
        appearance: none;
      }

      .adv-input.is-done {
        animation: adv-input-done 420ms cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }

      @keyframes adv-input-done {
        to {
          translate: -50% -60px;
          scale: 0.6;
          opacity: 0;
        }
      }

      /* 交易单：几秒内点「成交」＝花等级换一段奖励 */
      .card-deal {
        position: absolute;
        left: 50%;
        top: calc(var(--hud-h) + 96px);
        z-index: 13;
        width: min(78%, 300px);
        padding: 18px 16px 16px;
        border: var(--stroke) solid var(--c-ink);
        border-radius: var(--radius-panel);
        background: var(--c-cream);
        box-shadow: 4px 5px 0 var(--c-ink);
        color: var(--c-ink);
        text-align: center;
        translate: -50% 0;
        rotate: 2deg;
      }

      .card-deal[hidden] {
        display: none;
      }

      .card-deal .stamp-tag {
        left: 12px;
        top: -12px;
        font-size: 12px;
      }

      .card-deal-text {
        margin: 0 0 6px;
        font-size: 14px;
        line-height: 1.5;
      }

      .card-deal-cost {
        margin: 0 0 10px;
        color: #8a3cff;
        font-family: var(--font-num);
        font-size: 28px;
      }

      .card-deal-yes {
        padding: 8px 26px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 6px;
        background: #c77dff;
        box-shadow: 3px 3px 0 var(--c-ink);
        color: var(--c-ink);
        font: inherit;
        font-size: 16px;
        transform: skewX(var(--skew-button));
        cursor: pointer;
        appearance: none;
      }

      .card-deal-timer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: var(--c-vermilion);
        transform-origin: left;
      }


      /* ---------- 21 点（blackjack.js，008 起）：上方是胜场，荷官小姐的牌在右上、你的牌在台词条上面（两排右边对齐），「要牌 / 停牌 / 加倍」和思考时间条在你的牌上面 ---------- */
      .bj {
        position: absolute;
        inset: 0;
        z-index: 15;
        pointer-events: none;
      }

      .bj:not(.is-on) {
        display: none;
      }

      /* 胜场：HUD 下面正中一条——几颗格子 + 「1 / 3」，赢一手亮一颗 */
      .bj-score {
        position: absolute;
        left: 50%;
        top: calc(var(--hud-h) + 10px);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 4px 10px 4px 8px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 999px;
        background: rgb(11 11 18 / 0.82);
        box-shadow: 2px 3px 0 var(--c-ink);
        translate: -50% 0;
      }

      .bj-score-tag {
        color: #e6ccff;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .bj-score-pips {
        display: flex;
        gap: 5px;
      }

      .bj-score-pips i {
        width: 11px;
        height: 11px;
        border: 2px solid var(--c-cream);
        border-radius: 2px;
        rotate: 45deg;
      }

      .bj-score-pips i.is-won {
        border-color: var(--c-ink);
        background: var(--c-hud);
        box-shadow: 0 0 0 1.5px var(--c-hud);
      }

      .bj-score-num {
        color: var(--c-hud);
        font-family: var(--font-num);
        font-size: 15px;
        font-weight: normal;
        line-height: 1;
      }

      .bj-dealer,
      .bj-player {
        position: absolute;
        right: 96px;
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        gap: 8px;
      }

      .bj-dealer {
        top: calc(var(--hud-h) + 48px);
      }

      /* 你的牌靠右（左边是大大的秒数），点数在牌的左边；分牌时两格从右往左排，正在打的那一格亮着 */
      .bj-player {
        top: calc(var(--say-top) - 96px);
        gap: 14px;
      }

      .bj-seat {
        position: relative;
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        gap: 6px;
        transition: opacity 0.2s;
      }

      .bj-player.is-split .bj-seat:not(.is-active) {
        opacity: 0.55;
      }

      .bj-player.is-split .bj-seat.is-active::after {
        content: '';
        position: absolute;
        inset: -6px -5px;
        border: 2px solid var(--c-hud);
        border-radius: 9px;
        pointer-events: none;
      }

      /* 分牌的结果：每一格上面一枚小字（赢 / 输 / 平 / 爆） */
      .bj-seat-tag {
        --sticker-fill: var(--c-cream);

        position: absolute;
        left: 50%;
        bottom: calc(100% + 6px);
        font-size: 18px;
        translate: -50% 0;
        pointer-events: none;
      }

      .bj-seat-tag--win {
        --sticker-fill: var(--c-hud);
      }

      .bj-seat-tag--lose,
      .bj-seat-tag--bust {
        --sticker-fill: #ff6fae;
      }

      /* 爆牌：画面红光一闪 */
      .bj-redflash {
        position: absolute;
        inset: 0;
        z-index: 16;
        background: radial-gradient(circle at 50% 70%, rgb(255 40 80 / 0) 30%, rgb(255 40 80 / 0.55) 100%);
        pointer-events: none;
      }

      .bj-cards {
        position: relative;
        display: flex;
      }

      .bj-card {
        position: relative;
        flex: none;
        width: 46px;
        height: 64px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 6px;
        background: var(--c-cream);
        box-shadow: 2px 3px 0 var(--c-ink);
        color: var(--c-ink);
        font-family: var(--font-num);
      }

      .bj-card + .bj-card {
        margin-left: -16px;
      }

      .bj-card[data-red='1'] {
        color: var(--c-vermilion);
      }

      .bj-card-face {
        position: absolute;
        inset: 0;
        border-radius: 4px;
      }

      .bj-card-r {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: 17px;
        line-height: 1;
      }

      .bj-card-r2 {
        left: auto;
        top: auto;
        right: 4px;
        bottom: 2px;
        rotate: 180deg;
      }

      .bj-card-s {
        position: absolute;
        left: 50%;
        top: 52%;
        font-size: 26px;
        font-style: normal;
        line-height: 1;
        translate: -50% -50%;
      }

      .bj-card-back {
        position: absolute;
        inset: 2px;
        display: none;
        border-radius: 3px;
        background:
          repeating-linear-gradient(45deg, rgb(255 210 63 / 0.45) 0 2px, transparent 2px 7px),
          repeating-linear-gradient(-45deg, rgb(255 210 63 / 0.45) 0 2px, transparent 2px 7px),
          #3a1248;
      }

      .bj-card.is-down .bj-card-face {
        display: none;
      }

      .bj-card.is-down .bj-card-back {
        display: block;
      }

      /* 被魔法改写过的牌：黑色的红桃，数字是紫黑的 */
      .bj-card[data-magic='1'] {
        background: #f1e4ff;
        color: #1c0b1e;
      }

      .bj-card[data-magic='1'] .bj-card-s {
        color: #1c0b1e;
        text-shadow:
          0 0 3px #a86bff,
          0 0 1px #a86bff;
      }

      /* 小丑（0 点）：紫底、三角帽 */
      .bj-card[data-joker='1'] {
        background: #e6d4ff;
        color: #5b2a91;
      }

      .bj-card[data-joker='1'] .bj-card-s {
        width: 30px;
        height: 30px;
      }

      .bj-card[data-joker='1'] .bj-card-s svg {
        width: 100%;
        height: 100%;
      }

      .bj-card.is-joker {
        pointer-events: auto;
        touch-action: none;
      }

      /* 塞进来的 20 点粉牌：牌面是她的立绘（脸那一块），粉框 */
      .bj-card[data-slip='1'] {
        border-color: #d4247a;
        background: #ffd3e8;
        color: #fff;
      }

      .bj-card[data-slip='1'] .bj-card-face {
        background-position: 50% 6%;
        background-size: 300% auto;
      }

      .bj-card[data-slip='1'] .bj-card-r {
        text-shadow:
          -1.5px -1.5px 0 #d4247a,
          1.5px -1.5px 0 #d4247a,
          -1.5px 1.5px 0 #d4247a,
          1.5px 1.5px 0 #d4247a;
      }

      .bj-card[data-slip='1'] .bj-card-s {
        top: 78%;
        color: #ff3d8b;
        font-size: 18px;
        text-shadow: 0 0 2px #fff;
      }

      /* 她伸手换牌：那张闪金光，点住就拦下来 */
      .bj-card.is-spark {
        z-index: 2;
        pointer-events: auto;
        cursor: pointer;
        animation: bj-spark 0.36s ease-in-out infinite alternate;
      }

      .bj-card.is-spark::before {
        content: '';
        position: absolute;
        inset: -16px;
      }

      @keyframes bj-spark {
        0% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 6px 3px rgb(255 210 63 / 0.6);
        }
        100% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 20px 9px rgb(255 210 63 / 1);
        }
      }

      .bj-card.is-caught::after {
        content: '✕';
        position: absolute;
        left: 50%;
        top: 50%;
        color: var(--c-vermilion);
        font-size: 40px;
        line-height: 1;
        translate: -50% -50%;
        text-shadow: 2px 2px 0 var(--c-ink);
      }

      /* 塞进来的牌：发粉光，点它放大 */
      .bj-card.is-slip {
        z-index: 2;
        pointer-events: auto;
        touch-action: none;
        cursor: pointer;
        animation: bj-slip 0.4s ease-in-out infinite alternate;
      }

      .bj-card.is-slip::before {
        content: '';
        position: absolute;
        inset: -14px -10px;
      }

      @keyframes bj-slip {
        0% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 6px 3px rgb(255 61 139 / 0.55);
        }
        100% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 18px 8px rgb(255 61 139 / 0.95);
        }
      }

      /* 魔法：黑心围着牌，牌被紫黑的光吞进去、数字乱闪；被护符打散时闪一下白；改写成功时紫光一闪 */
      .bj-card.is-cursed {
        animation: bj-curse 0.18s ease-in-out infinite alternate;
      }

      @keyframes bj-curse {
        0% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 8px 4px rgb(28 11 30 / 0.85);
          filter: brightness(0.75) saturate(0.6);
        }
        100% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 16px 8px rgb(168 107 255 / 0.85);
          filter: brightness(0.55) hue-rotate(-30deg);
        }
      }

      .bj-card.is-purged {
        animation: bj-purge 0.6s ease-out;
      }

      @keyframes bj-purge {
        0% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 0 0 rgb(230 204 255 / 1);
          filter: brightness(2.2);
        }
        100% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 0 18px rgb(230 204 255 / 0);
          filter: none;
        }
      }

      .bj-card.is-rewritten {
        animation: bj-rewrite 0.5s ease-out;
      }

      @keyframes bj-rewrite {
        0% {
          box-shadow:
            2px 3px 0 var(--c-ink),
            0 0 24px 12px rgb(168 107 255 / 1);
          scale: 1.25;
        }
        100% {
          box-shadow: 2px 3px 0 var(--c-ink);
          scale: 1;
        }
      }

      /* 遮挡没点掉、被她说成另一张的牌：右上角一颗小黑心 */
      .bj-card.is-fake::after {
        content: '♥';
        position: absolute;
        right: 2px;
        top: 1px;
        color: #1c0b1e;
        font-size: 13px;
        line-height: 1;
        text-shadow: 0 0 2px #a86bff;
      }

      /* 魔法的黑心：fx.js 的 heartEl（大小、发光写在行内），这里只管叠在牌上面 */
      .bj-mheart {
        position: absolute;
        z-index: 17;
        pointer-events: none;
      }

      /* 心形魔法阵：垫在被改写的那张牌下面，外圈慢慢转、一圈小心、正中一颗大心；被护符打散时裂开 */
      .bj-sigil {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: -1;
        width: 132px;
        height: 132px;
        translate: -50% -50%;
        pointer-events: none;
        filter: drop-shadow(0 0 6px rgb(255 61 139 / 0.85)) drop-shadow(0 0 14px rgb(120 40 200 / 0.7));
      }

      .bj-sigil svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: bj-sigil 3.2s linear infinite;
      }

      @keyframes bj-sigil {
        100% {
          rotate: 360deg;
        }
      }

      .bj-sigil circle,
      .bj-sigil path {
        fill: none;
        stroke-linejoin: round;
      }

      .bj-sigil-o {
        stroke: #ff3d8b;
        stroke-width: 2.5;
      }

      .bj-sigil-i {
        stroke: #a86bff;
        stroke-width: 1.5;
        stroke-dasharray: 3 4;
      }

      .bj-sigil-runes path {
        fill: #1c0b1e;
        stroke: #ff6fae;
        stroke-width: 18;
      }

      .bj-sigil-heart {
        fill: rgb(28 11 30 / 0.55) !important;
        stroke: #ff3d8b;
        stroke-width: 6;
      }

      .bj-sigil.is-broken svg {
        animation: bj-sigil-break 0.5s ease-out forwards;
      }

      @keyframes bj-sigil-break {
        30% {
          scale: 1.15;
          filter: brightness(2.5);
        }
        100% {
          scale: 1.5;
          opacity: 0;
          filter: blur(3px);
        }
      }

      /* 护符张开的结界：六芒星 + 两圈，淡紫发光 */
      .bj-ward {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 4;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        pointer-events: none;
        filter: drop-shadow(0 0 6px rgb(230 204 255 / 1)) drop-shadow(0 0 16px rgb(176 103 255 / 0.9));
      }

      .bj-ward svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .bj-ward circle,
      .bj-ward path {
        fill: rgb(176 103 255 / 0.12);
        stroke: #f3dcff;
        stroke-width: 3;
        stroke-linejoin: round;
      }

      /* 「点护符！」：护符外面一圈紫光一胀一胀，名字换成粉色 */
      .bj-amulet.is-call .bj-amulet-gem {
        animation: bj-call 0.5s ease-in-out infinite alternate;
      }

      @keyframes bj-call {
        0% {
          filter: drop-shadow(2px 3px 0 var(--c-ink)) drop-shadow(0 0 6px rgb(176 103 255 / 0.9));
        }
        100% {
          filter: drop-shadow(2px 3px 0 var(--c-ink)) drop-shadow(0 0 18px rgb(230 204 255 / 1));
          scale: 1.12;
        }
      }

      .bj-amulet.is-call .bj-amulet-name {
        background: #ff3d8b;
        color: #fff;
        font-weight: 900;
      }

      /* 按钮第一次出来时冒的一句「怎么玩」 */
      .bj-hint {
        position: absolute;
        right: 0;
        bottom: calc(100% + 10px);
        z-index: 5;
        width: max-content;
        max-width: 190px;
        padding: 5px 8px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 8px;
        background: var(--c-cream);
        box-shadow: 2px 3px 0 var(--c-ink);
        color: var(--c-ink);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
        text-align: left;
        white-space: normal;
        transform: skewX(calc(var(--skew-button) * -1));
        pointer-events: none;
      }

      .bj-pop--amulet {
        --sticker-fill: #e6ccff;
      }

      .bj-mheart svg,
      .bj-cover svg,
      .bj-lock svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 护符打出去的紫光 */
      .bj-beam {
        position: absolute;
        z-index: 17;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, #e6ccff, #b067ff 30%, #e6ccff);
        box-shadow: 0 0 10px 3px rgb(176 103 255 / 0.9);
        transform-origin: 0 50%;
        pointer-events: none;
      }

      /* 遮挡（E）：一颗黑心盖住整张牌，点掉 */
      .bj-cover {
        position: absolute;
        inset: -8px -6px;
        z-index: 3;
        padding: 4px;
        border: 0;
        border-radius: 8px;
        background: rgb(28 11 30 / 0.92);
        box-shadow: 0 0 10px 2px rgb(168 107 255 / 0.7);
        pointer-events: auto;
        touch-action: manipulation;
        cursor: pointer;
        appearance: none;
        animation: bj-cover 0.9s ease-in-out infinite alternate;
      }

      @keyframes bj-cover {
        100% {
          box-shadow: 0 0 16px 5px rgb(168 107 255 / 0.95);
        }
      }

      /* 心锁（B / C）：一颗粉边黑心压在按钮上，点碎才按得动 */
      .bj-lock {
        position: absolute;
        inset: -6px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: rgb(28 11 30 / 0.78);
        pointer-events: none;
        transform: skewX(calc(var(--skew-button) * -1));
      }

      .bj-lock svg {
        width: 34px;
        height: 31px;
        filter: drop-shadow(0 0 5px rgb(255 111 174 / 0.9));
      }

      .bj-lock-n {
        position: absolute;
        right: 2px;
        bottom: -2px;
        color: #ff6fae;
        font-family: var(--font-num);
        font-size: 14px;
        font-weight: normal;
      }

      .bj-hit,
      .bj-stand {
        position: relative;
      }

      .bj-total {
        flex: none;
        min-width: 30px;
        padding: 2px 7px 1px;
        border: var(--stroke-sm) solid var(--c-ink);
        border-radius: 999px;
        background: var(--c-ink);
        color: var(--c-hud);
        font-family: var(--font-num);
        font-size: 18px;
        font-weight: normal;
        line-height: 1.2;
        text-align: center;
      }

      .bj-total:empty {
        display: none;
      }

      .bj-total[data-bust='1'] {
        background: var(--c-vermilion);
        color: var(--c-cream);
      }

      /* 牌上面的小签（「点住！」「点我」） */
      .bj-tag {
        --sticker-fill: #ffd23f;

        position: absolute;
        left: 50%;
        bottom: calc(100% + 4px);
        z-index: 4;
        font-size: 13px;
        white-space: nowrap;
        translate: -50% 0;
        pointer-events: none;
      }

      .bj-card.is-slip .bj-tag {
        --sticker-fill: #ff6fae;
      }

      /* 塞牌放大：画面正中一张大牌 + 一圈长按的环 */
      .bj-zoom {
        position: absolute;
        left: 50%;
        top: 44%;
        z-index: 18;
